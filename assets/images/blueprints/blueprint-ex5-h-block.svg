<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <pattern id="grid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="0.8"/>
    </pattern>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#080e18"/>
  <rect width="600" height="420" fill="url(#grid5)"/>
  
  <rect x="12" y="12" width="576" height="396" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <rect x="16" y="16" width="568" height="388" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="0.8"/>

  <!-- Title Block -->
  <g transform="translate(370, 340)">
    <rect width="210" height="60" fill="rgba(15, 23, 42, 0.9)" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="20" x2="210" y2="20" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="0" y1="40" x2="210" y2="40" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="105" y1="0" x2="105" y2="60" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="8" y="14" fill="#94a3b8" font-family="monospace" font-size="9">EX-05 // 3D PART</text>
    <text x="112" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">SCALE 1:1</text>
    <text x="8" y="34" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">SYMMETRIC H-BLOCK</text>
    <text x="112" y="34" fill="#38bdf8" font-family="monospace" font-size="9">UNITS: MM</text>
    <text x="8" y="54" fill="#38bdf8" font-family="monospace" font-size="9">62 × 50 × 44 SOLID</text>
    <text x="112" y="54" fill="#10b981" font-family="monospace" font-size="9">MID-PLANE</text>
  </g>

  <!-- Left: Top View Orthographic (H-Shape Profile & Cylinders) -->
  <g transform="translate(40, 50)">
    <text x="0" y="14" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// TOP VIEW (ORTHOGRAPHIC)</text>
    
    <!-- Outer Block 62 x 50 (Scaled: 62mm -> 155px, 50mm -> 125px) -->
    <!-- Two Semi-cylinders R15 on sides (r=37.5px) -->
    <path d="M 30 50 
             L 80 50 
             A 30 30 0 0 1 140 50 
             L 190 50 
             L 190 175 
             L 140 175 
             A 30 30 0 0 1 80 175 
             L 30 175 Z" 
          fill="rgba(14, 165, 233, 0.1)" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow5)"/>

    <!-- Central Through Hole Ø20 (r=25px) -->
    <circle cx="110" cy="112.5" r="25" fill="#080e18" stroke="#38bdf8" stroke-width="2"/>
    <!-- Center Axes -->
    <line x1="20" y1="112.5" x2="200" y2="112.5" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="6,3"/>
    <line x1="110" y1="35" x2="110" y2="190" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="6,3"/>

    <!-- Internal Rectangular Cutout 14 x 18 -->
    <rect x="92" y="94.5" width="36" height="36" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="3,2"/>

    <!-- Dimensions -->
    <!-- Length 62 -->
    <line x1="30" y1="35" x2="190" y2="35" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="30,35 38,32 38,38" fill="#38bdf8"/>
    <polygon points="190,35 182,32 182,38" fill="#38bdf8"/>
    <text x="100" y="28" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">62</text>

    <!-- Width 50 -->
    <line x1="15" y1="50" x2="15" y2="175" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="15,50 12,58 18,58" fill="#38bdf8"/>
    <polygon points="15,175 12,167 18,167" fill="#38bdf8"/>
    <text x="0" y="116" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">50</text>

    <!-- Ø20 Callout -->
    <text x="138" y="110" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">Ø20 THRU</text>
    <!-- R15 Cutout Callout -->
    <text x="75" y="195" fill="#f59e0b" font-family="monospace" font-size="10">2X R15 CYL CUT</text>
  </g>

  <!-- Right: 3D Isometric View -->
  <g transform="translate(320, 60)">
    <text x="0" y="14" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// 3D ISOMETRIC SOLID</text>

    <!-- Isometric Rendering of H-Block with Height 44 -->
    <!-- Top Face -->
    <polygon points="40,110 110,70 170,105 100,145" fill="rgba(56, 189, 248, 0.4)" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Left Front Face -->
    <polygon points="40,110 100,145 100,210 40,175" fill="rgba(14, 165, 233, 0.2)" stroke="#00f2fe" stroke-width="2"/>
    <!-- Right Front Face -->
    <polygon points="100,145 170,105 170,170 100,210" fill="rgba(2, 132, 199, 0.3)" stroke="#00f2fe" stroke-width="2"/>

    <!-- Cylinder Bore on Top Face (Ellipse in Iso) -->
    <ellipse cx="105" cy="107" rx="18" ry="10" fill="#080e18" stroke="#00f2fe" stroke-width="1.8"/>
    
    <!-- Side Cutouts (H-Block channels) -->
    <path d="M 65 95 Q 75 102 85 90" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    <path d="M 125 125 Q 135 132 145 120" fill="none" stroke="#f59e0b" stroke-width="1.8"/>

    <!-- Height 44 Dimension -->
    <line x1="185" y1="105" x2="185" y2="170" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="185,105 182,113 188,113" fill="#38bdf8"/>
    <polygon points="185,170 182,162 188,162" fill="#38bdf8"/>
    <text x="192" y="142" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">H: 44</text>

    <!-- Wall thickness notes -->
    <text x="20" y="240" fill="#94a3b8" font-family="monospace" font-size="10">WALLS: 12, 15, 16 MM // SLOTS: 14×18</text>
  </g>
</svg>
