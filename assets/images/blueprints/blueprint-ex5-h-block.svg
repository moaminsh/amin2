<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="100%" height="100%">
  <defs>
    <pattern id="cadGrid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="0.75"/>
    </pattern>
    <pattern id="cadGridMajor5" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1"/>
    </pattern>
    <pattern id="hatch5" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <marker id="arrEnd5" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrStart5" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 2 L 0 5 L 10 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrSec5" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 Z" fill="#f43f5e"/>
    </marker>
    <filter id="glow5" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sheet Background -->
  <rect width="840" height="580" fill="#060b13" class="cad-bg"/>
  <rect width="840" height="580" fill="url(#cadGrid5)" class="cad-grid"/>
  <rect width="840" height="580" fill="url(#cadGridMajor5)" class="cad-grid-major"/>

  <!-- ISO Border & Zone References -->
  <rect x="18" y="16" width="804" height="548" fill="none" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="23" y="21" width="794" height="538" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="0.8"/>

  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">
    <text x="73" y="14">1</text><text x="73" y="570">1</text>
    <text x="173" y="14">2</text><text x="173" y="570">2</text>
    <text x="273" y="14">3</text><text x="273" y="570">3</text>
    <text x="373" y="14">4</text><text x="373" y="570">4</text>
    <text x="473" y="14">5</text><text x="473" y="570">5</text>
    <text x="573" y="14">6</text><text x="573" y="570">6</text>
    <text x="673" y="14">7</text><text x="673" y="570">7</text>
    <text x="773" y="14">8</text><text x="773" y="570">8</text>
  </g>
  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle" dominant-baseline="central">
    <text x="10" y="85">A</text><text x="830" y="85">A</text>
    <text x="10" y="220">B</text><text x="830" y="220">B</text>
    <text x="10" y="355">C</text><text x="830" y="355">C</text>
    <text x="10" y="490">D</text><text x="830" y="490">D</text>
  </g>

  <!-- Title Block (ISO 7200) -->
  <g transform="translate(480, 440)">
    <rect width="337" height="119" fill="rgba(10, 18, 30, 0.95)" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="337" y2="28" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="56" x2="337" y2="56" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="84" x2="337" y2="84" stroke="#0284c7" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="84" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="245" y1="28" x2="245" y2="84" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="75" y1="84" x2="75" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="160" y1="84" x2="160" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="245" y1="84" x2="245" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>

    <text x="8" y="13" fill="#64748b" font-family="monospace" font-size="8">ORGANIZATION / LAB</text>
    <text x="8" y="23" fill="#00f2fe" font-family="monospace" font-size="10.5" font-weight="bold">M. SHARIF CAD ACADEMY</text>
    <text x="168" y="13" fill="#64748b" font-family="monospace" font-size="8">DRAWING NUMBER</text>
    <text x="168" y="24" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">MAS-SW-EX05-REV.B</text>

    <text x="8" y="41" fill="#64748b" font-family="monospace" font-size="8">TITLE / PART DESCRIPTION</text>
    <text x="8" y="52" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">SYMMETRIC H-BLOCK</text>
    <text x="168" y="41" fill="#64748b" font-family="monospace" font-size="8">PROJECTION</text>
    <g transform="translate(185, 48)">
      <polygon points="0,4 0,-4 14,-7 14,7" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
      <line x1="-4" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="3,1.5"/>
      <circle cx="24" cy="0" r="4" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
      <circle cx="24" cy="0" r="7" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
    </g>
    <text x="252" y="41" fill="#64748b" font-family="monospace" font-size="8">MATERIAL</text>
    <text x="252" y="52" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="bold">TOOL STEEL O1</text>

    <text x="8" y="69" fill="#64748b" font-family="monospace" font-size="8">GENERAL TOLERANCE</text>
    <text x="8" y="80" fill="#94a3b8" font-family="monospace" font-size="9">ISO 2768-mK (±0.05 mm)</text>
    <text x="168" y="69" fill="#64748b" font-family="monospace" font-size="8">SURFACE FINISH</text>
    <text x="168" y="80" fill="#f8fafc" font-family="monospace" font-size="9">Ra 0.8 µm ▽▽▽</text>
    <text x="252" y="69" fill="#64748b" font-family="monospace" font-size="8">WEIGHT (CALC)</text>
    <text x="252" y="80" fill="#94a3b8" font-family="monospace" font-size="9">0.785 kg</text>

    <text x="8" y="97" fill="#64748b" font-family="monospace" font-size="7.5">DESIGNED BY</text>
    <text x="8" y="112" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">M. SHARIF</text>
    <text x="82" y="97" fill="#64748b" font-family="monospace" font-size="7.5">APPROVED</text>
    <text x="82" y="112" fill="#38bdf8" font-family="monospace" font-size="9">ENG. QA</text>
    <text x="168" y="97" fill="#64748b" font-family="monospace" font-size="7.5">SCALE</text>
    <text x="168" y="112" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">1:1 (A3)</text>
    <text x="252" y="97" fill="#64748b" font-family="monospace" font-size="7.5">STATUS</text>
    <text x="252" y="112" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">RELEASED</text>
  </g>

  <!-- Technical Notes -->
  <g transform="translate(35, 472)">
    <rect width="270" height="85" fill="rgba(10, 18, 30, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9.5" font-weight="bold">TECHNICAL NOTES // مـلاحظـات فـنـی:</text>
    <text x="10" y="32" fill="#94a3b8" font-family="monospace" font-size="8.5">1. OVERALL ENVELOPE: 62.00 x 50.00 x 44.00 MM.</text>
    <text x="10" y="46" fill="#94a3b8" font-family="monospace" font-size="8.5">2. BORE Ø20 H7 (+0.021/0) GROUND FIT CENTER HOLE.</text>
    <text x="10" y="60" fill="#94a3b8" font-family="monospace" font-size="8.5">3. 2X R15.00 CYLINDRICAL CUTAWAYS SYMMETRIC TO DATUM B.</text>
    <text x="10" y="74" fill="#10b981" font-family="monospace" font-size="8.5">4. BREAK ALL SHARP CORNERS 0.5 x 45°.</text>
  </g>

  <!-- 3D Isometric Preview Inset -->
  <g transform="translate(635, 45)">
    <rect width="180" height="150" fill="rgba(8, 14, 24, 0.9)" stroke="#0284c7" stroke-width="1.2"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">ISOMETRIC VIEW (3D)</text>
    <text x="10" y="27" fill="#64748b" font-family="monospace" font-size="7.5">SOLIDWORKS SOLID BODY</text>

    <g transform="translate(90, 85) scale(0.6)">
      <!-- Isometric H-Block Body -->
      <polygon points="-40,-15 0,-38 40,-15 0,8" fill="#1e3a5f" stroke="#00f2fe" stroke-width="1.8"/>
      <polygon points="-40,-15 0,8 0,38 -40,15" fill="#0f2b48" stroke="#00f2fe" stroke-width="1.8"/>
      <polygon points="0,8 40,-15 40,15 0,38" fill="#0b1e33" stroke="#00f2fe" stroke-width="1.8"/>
      <!-- Cutout Grooves in 3D -->
      <ellipse cx="0" cy="-15" rx="14" ry="7" fill="#060b13" stroke="#38bdf8" stroke-width="1.5"/>
    </g>
    <text x="10" y="142" fill="#f59e0b" font-family="monospace" font-size="8">SYMMETRIC H-PROFILE</text>
  </g>

  <!-- ==================== VIEW 1: FRONT ELEVATION ==================== -->
  <g transform="translate(180, 230)">
    <text x="-130" y="-185" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold">FRONT VIEW // نمای روبرو و مقطع H</text>
    <text x="-130" y="-172" fill="#64748b" font-family="monospace" font-size="9">PLANE: FRONT PLANE // FULLY SYMMETRIC</text>

    <!-- Cutting Plane Line D-D (Horizontal) -->
    <line x1="-120" y1="0" x2="-80" y2="0" stroke="#f43f5e" stroke-width="2.5"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#f43f5e" stroke-width="1" stroke-dasharray="14,4,3,4"/>
    <line x1="80" y1="0" x2="120" y2="0" stroke="#f43f5e" stroke-width="2.5"/>
    <line x1="-115" y1="0" x2="-115" y2="-18" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrSec5)"/>
    <text x="-118" y="-22" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">D</text>
    <line x1="115" y1="0" x2="115" y2="-18" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrSec5)"/>
    <text x="112" y="-22" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">D</text>

    <!-- Center Axes -->
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="12,4,2,4"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="12,4,2,4"/>

    <!-- Outer H Profile with Side Recesses R15 -->
    <path d="M -62 -44 
             L -20 -44 
             L -20 -15 
             L 20 -15 
             L 20 -44 
             L 62 -44 
             L 62 44 
             L 20 44 
             L 20 15 
             L -20 15 
             L -20 44 
             L -62 44 Z" 
          fill="rgba(14, 165, 233, 0.08)" stroke="#00f2fe" stroke-width="2.4" filter="url(#glow5)"/>

    <!-- Center Bore Hole Ø20 -->
    <circle cx="0" cy="0" r="14" fill="#060b13" stroke="#38bdf8" stroke-width="2"/>

    <!-- Left & Right Cutaways (R15) -->
    <path d="M -62 -15 A 15 15 0 0 1 -62 15" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 62 -15 A 15 15 0 0 1 62 15" fill="none" stroke="#f59e0b" stroke-width="2"/>

    <!-- Dimensions -->
    <!-- Overall Width 62.00 -->
    <line x1="-62" y1="-65" x2="62" y2="-65" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrStart5)" marker-end="url(#arrEnd5)"/>
    <line x1="-62" y1="-44" x2="-62" y2="-68" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="62" y1="-44" x2="62" y2="-68" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="0" y="-70" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">62.00 ±0.05</text>

    <!-- Overall Height 44.00 -->
    <line x1="85" y1="-44" x2="85" y2="44" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrStart5)" marker-end="url(#arrEnd5)"/>
    <line x1="62" y1="-44" x2="88" y2="-44" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="62" y1="44" x2="88" y2="44" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="95" y="4" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">44.00</text>

    <!-- Center Bore Ø20 H7 -->
    <line x1="0" y1="0" x2="-45" y2="-85" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart5)"/>
    <line x1="-45" y1="-85" x2="-115" y2="-85" stroke="#38bdf8" stroke-width="1"/>
    <text x="-112" y="-90" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">BORE Ø20 H7</text>

    <!-- Top Channel Width 40.00 -->
    <line x1="-20" y1="-28" x2="20" y2="-28" stroke="#f59e0b" stroke-width="1" marker-start="url(#arrStart5)" marker-end="url(#arrEnd5)"/>
    <text x="0" y="-33" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">40.00</text>

    <!-- Side Arc R15 Callout -->
    <line x1="62" y1="0" x2="105" y2="-20" stroke="#f59e0b" stroke-width="1" marker-start="url(#arrStart5)"/>
    <text x="110" y="-22" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">2X R15.00</text>

    <!-- Datum A Target on Base -->
    <g transform="translate(0, 44)">
      <polygon points="0,0 -6,10 6,10" fill="#f8fafc"/>
      <line x1="0" y1="10" x2="0" y2="25" stroke="#f8fafc" stroke-width="1.2"/>
      <rect x="-9" y="25" width="18" height="18" fill="rgba(15, 23, 42, 0.95)" stroke="#f8fafc" stroke-width="1.2"/>
      <text x="0" y="38" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">A</text>
    </g>
  </g>

  <!-- ==================== VIEW 2: SECTION D-D (HORIZONTAL CUT) ==================== -->
  <g transform="translate(420, 230)">
    <text x="-50" y="-185" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold">SECTION D-D // مقطع افقی با عمق ۵۰</text>
    <text x="-50" y="-172" fill="#64748b" font-family="monospace" font-size="9">SCALE 1:1 // SHOWING FULL THRU BORE</text>

    <!-- Depth 50.00 mm (drawn as 70 in SVG units) -->
    <!-- Left Section Cut Block (Hatched) -->
    <rect x="-62" y="-35" width="48" height="70" fill="url(#hatch5)" stroke="#00f2fe" stroke-width="1.8"/>
    <!-- Center Bore Void between -14 and 14 -->
    <line x1="-14" y1="-35" x2="-14" y2="35" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="14" y1="-35" x2="14" y2="35" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Right Section Cut Block (Hatched) -->
    <rect x="14" y="-35" width="48" height="70" fill="url(#hatch5)" stroke="#00f2fe" stroke-width="1.8"/>

    <!-- Depth Dimension 50.00 -->
    <line x1="75" y1="-35" x2="75" y2="35" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrStart5)" marker-end="url(#arrEnd5)"/>
    <line x1="62" y1="-35" x2="78" y2="-35" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="62" y1="35" x2="78" y2="35" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="85" y="4" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">50.00 ±0.1</text>

    <!-- GD&T Symmetry Frame -->
    <g transform="translate(-25, 60)">
      <rect width="85" height="18" fill="rgba(15, 23, 42, 0.95)" stroke="#38bdf8" stroke-width="1"/>
      <line x1="22" y1="0" x2="22" y2="18" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="58" y1="0" x2="58" y2="18" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="11" y="13" fill="#f59e0b" font-family="monospace" font-size="12" text-anchor="middle">⌯</text>
      <text x="40" y="12.5" fill="#f8fafc" font-family="monospace" font-size="9" text-anchor="middle">0.02</text>
      <text x="72" y="12.5" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">A</text>
    </g>
  </g>
</svg>
