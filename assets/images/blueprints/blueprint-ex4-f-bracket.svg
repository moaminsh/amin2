<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <pattern id="grid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="0.8"/>
    </pattern>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#080e18"/>
  <rect width="600" height="420" fill="url(#grid4)"/>
  
  <rect x="12" y="12" width="576" height="396" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <rect x="16" y="16" width="568" height="388" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="0.8"/>

  <!-- Title Block -->
  <g transform="translate(370, 340)">
    <rect width="210" height="60" fill="rgba(15, 23, 42, 0.9)" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="20" x2="210" y2="20" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="0" y1="40" x2="210" y2="40" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="105" y1="0" x2="105" y2="60" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="8" y="14" fill="#94a3b8" font-family="monospace" font-size="9">EX-04 // 3D PART</text>
    <text x="112" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">SCALE 1:1</text>
    <text x="8" y="34" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">ANGLED F-BRACKET</text>
    <text x="112" y="34" fill="#38bdf8" font-family="monospace" font-size="9">UNITS: MM</text>
    <text x="8" y="54" fill="#38bdf8" font-family="monospace" font-size="9">EXTRUDED SLANTED</text>
    <text x="112" y="54" fill="#10b981" font-family="monospace" font-size="9">3D SOLID</text>
  </g>

  <!-- Left: 2D Profile with Dimensions -->
  <g transform="translate(50, 40)">
    <text x="0" y="16" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// FRONT VIEW (F-PROFILE)</text>
    
    <!-- F Profile -->
    <!-- Base 50, Height 93, Thickness 18, arms 28 and 22 -->
    <!-- Scale: 1mm = 2px -> 93mm = 186px, 50mm = 100px, 18mm = 36px -->
    <path d="M 40 220 
             L 140 220 
             L 140 184 
             L 76 184 
             L 76 148 
             L 132 148 
             L 132 112 
             L 76 112 
             L 76 34 
             L 40 34 Z" 
          fill="rgba(14, 165, 233, 0.08)" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow4)"/>

    <!-- Slanted Rib (90mm at 40° angle from back face) -->
    <path d="M 40 112 L -10 170 L 40 220 Z" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4,2"/>
    <text x="-40" y="165" fill="#f59e0b" font-family="monospace" font-size="9">RIB 90</text>

    <!-- Keyway Slot 10mm -->
    <rect x="52" y="184" width="16" height="36" fill="rgba(8, 14, 24, 0.9)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="80" y="206" fill="#f59e0b" font-family="monospace" font-size="9">SLOT 10</text>

    <!-- Dimension: Height 93 -->
    <line x1="20" y1="34" x2="20" y2="220" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="20,34 17,44 23,44" fill="#38bdf8"/>
    <polygon points="20,220 17,210 23,210" fill="#38bdf8"/>
    <text x="0" y="130" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">93</text>

    <!-- Dimension: Base 50 -->
    <line x1="40" y1="238" x2="140" y2="238" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="40,238 50,235 50,241" fill="#38bdf8"/>
    <polygon points="140,238 130,235 130,241" fill="#38bdf8"/>
    <text x="85" y="252" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">50</text>

    <!-- Arm dimensions 28 and 22 -->
    <text x="145" y="134" fill="#94a3b8" font-family="monospace" font-size="10">28</text>
    <text x="145" y="206" fill="#94a3b8" font-family="monospace" font-size="10">22</text>
    <text x="82" y="100" fill="#94a3b8" font-family="monospace" font-size="10">THK: 18</text>
  </g>

  <!-- Right: 3D Isometric View -->
  <g transform="translate(340, 50)">
    <text x="0" y="16" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// 3D ISOMETRIC SOLID</text>

    <!-- Isometric projection of F-Bracket -->
    <!-- Front Face -->
    <polygon points="50,140 100,115 100,135 75,147 75,165 95,155 95,175 75,185 75,225 50,238" 
             fill="rgba(14, 165, 233, 0.2)" stroke="#00f2fe" stroke-width="2"/>
    
    <!-- Top Faces -->
    <polygon points="50,140 85,120 135,145 100,165" fill="rgba(56, 189, 248, 0.4)" stroke="#38bdf8" stroke-width="1.8"/>
    <polygon points="75,165 110,145 130,155 95,175" fill="rgba(56, 189, 248, 0.35)" stroke="#38bdf8" stroke-width="1.8"/>
    <polygon points="75,205 110,185 135,198 100,218" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Right Side Faces -->
    <polygon points="100,115 135,135 135,155 100,135" fill="rgba(2, 132, 199, 0.3)" stroke="#00f2fe" stroke-width="1.8"/>
    <polygon points="95,155 130,175 130,195 95,175" fill="rgba(2, 132, 199, 0.3)" stroke="#00f2fe" stroke-width="1.8"/>
    <polygon points="100,218 135,238 135,258 100,238" fill="rgba(2, 132, 199, 0.3)" stroke="#00f2fe" stroke-width="1.8"/>

    <!-- Slanted Triangular Gusset 90mm -->
    <polygon points="50,238 85,218 20,180" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.8"/>
    
    <!-- Coordinate Triad (X, Y, Z) -->
    <g transform="translate(160, 220)">
      <line x1="0" y1="0" x2="30" y2="15" stroke="#ef4444" stroke-width="2"/>
      <text x="32" y="20" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold">X</text>
      <line x1="0" y1="0" x2="-25" y2="15" stroke="#10b981" stroke-width="2"/>
      <text x="-32" y="20" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">Z</text>
      <line x1="0" y1="0" x2="0" y2="-30" stroke="#00f2fe" stroke-width="2"/>
      <text x="4" y="-28" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">Y</text>
    </g>
  </g>
</svg>
