<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="100%" height="100%">
  <defs>
    <pattern id="cadGrid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="0.75"/>
    </pattern>
    <pattern id="cadGridMajor4" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrEnd4" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrStart4" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 2 L 0 5 L 10 8 Z" fill="#38bdf8"/>
    </marker>
    <filter id="glow4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sheet Background -->
  <rect width="840" height="580" fill="#060b13" class="cad-bg"/>
  <rect width="840" height="580" fill="url(#cadGrid4)" class="cad-grid"/>
  <rect width="840" height="580" fill="url(#cadGridMajor4)" class="cad-grid-major"/>

  <!-- ISO Border & Zone Grid -->
  <rect x="18" y="16" width="804" height="548" fill="none" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="23" y="21" width="794" height="538" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="0.8"/>

  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">
    <text x="73" y="14">1</text><text x="73" y="570">1</text>
    <text x="173" y="14">2</text><text x="173" y="570">2</text>
    <text x="273" y="14">3</text><text x="273" y="570">3</text>
    <text x="373" y="14">4</text><text x="373" y="570">4</text>
    <text x="473" y="14">5</text><text x="473" y="570">5</text>
    <text x="573" y="14">6</text><text x="573" y="570">6</text>
    <text x="673" y="14">7</text><text x="673" y="570">7</text>
    <text x="773" y="14">8</text><text x="773" y="570">8</text>
  </g>
  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle" dominant-baseline="central">
    <text x="10" y="85">A</text><text x="830" y="85">A</text>
    <text x="10" y="220">B</text><text x="830" y="220">B</text>
    <text x="10" y="355">C</text><text x="830" y="355">C</text>
    <text x="10" y="490">D</text><text x="830" y="490">D</text>
  </g>

  <!-- Title Block (ISO 7200) -->
  <g transform="translate(480, 440)">
    <rect width="337" height="119" fill="rgba(10, 18, 30, 0.95)" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="337" y2="28" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="56" x2="337" y2="56" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="84" x2="337" y2="84" stroke="#0284c7" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="84" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="245" y1="28" x2="245" y2="84" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="75" y1="84" x2="75" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="160" y1="84" x2="160" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="245" y1="84" x2="245" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>

    <text x="8" y="13" fill="#64748b" font-family="monospace" font-size="8">ORGANIZATION / LAB</text>
    <text x="8" y="23" fill="#00f2fe" font-family="monospace" font-size="10.5" font-weight="bold">M. SHARIF CAD ACADEMY</text>
    <text x="168" y="13" fill="#64748b" font-family="monospace" font-size="8">DRAWING NUMBER</text>
    <text x="168" y="24" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">MAS-SW-EX04-REV.A</text>

    <text x="8" y="41" fill="#64748b" font-family="monospace" font-size="8">TITLE / PART DESCRIPTION</text>
    <text x="8" y="52" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">ANGLED F-BRACKET</text>
    <text x="168" y="41" fill="#64748b" font-family="monospace" font-size="8">PROJECTION</text>
    <g transform="translate(185, 48)">
      <polygon points="0,4 0,-4 14,-7 14,7" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
      <line x1="-4" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="3,1.5"/>
      <circle cx="24" cy="0" r="4" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
      <circle cx="24" cy="0" r="7" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
    </g>
    <text x="252" y="41" fill="#64748b" font-family="monospace" font-size="8">MATERIAL</text>
    <text x="252" y="52" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="bold">AL 6061-T6</text>

    <text x="8" y="69" fill="#64748b" font-family="monospace" font-size="8">GENERAL TOLERANCE</text>
    <text x="8" y="80" fill="#94a3b8" font-family="monospace" font-size="9">ISO 2768-m (±0.1 mm)</text>
    <text x="168" y="69" fill="#64748b" font-family="monospace" font-size="8">SURFACE FINISH</text>
    <text x="168" y="80" fill="#f8fafc" font-family="monospace" font-size="9">Ra 1.6 µm ▽▽</text>
    <text x="252" y="69" fill="#64748b" font-family="monospace" font-size="8">WEIGHT (CALC)</text>
    <text x="252" y="80" fill="#94a3b8" font-family="monospace" font-size="9">0.680 kg</text>

    <text x="8" y="97" fill="#64748b" font-family="monospace" font-size="7.5">DESIGNED BY</text>
    <text x="8" y="112" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">M. SHARIF</text>
    <text x="82" y="97" fill="#64748b" font-family="monospace" font-size="7.5">APPROVED</text>
    <text x="82" y="112" fill="#38bdf8" font-family="monospace" font-size="9">ENG. QA</text>
    <text x="168" y="97" fill="#64748b" font-family="monospace" font-size="7.5">SCALE</text>
    <text x="168" y="112" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">1:1 (A3)</text>
    <text x="252" y="97" fill="#64748b" font-family="monospace" font-size="7.5">STATUS</text>
    <text x="252" y="112" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">RELEASED</text>
  </g>

  <!-- Technical Notes -->
  <g transform="translate(35, 472)">
    <rect width="270" height="85" fill="rgba(10, 18, 30, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9.5" font-weight="bold">TECHNICAL NOTES // مـلاحظـات فـنـی:</text>
    <text x="10" y="32" fill="#94a3b8" font-family="monospace" font-size="8.5">1. BASE PROFILE SKETCH EXTRUDED 90.00 MM.</text>
    <text x="10" y="46" fill="#94a3b8" font-family="monospace" font-size="8.5">2. COMPOUND CHAMFER CUT AT 35.0° ANGLE.</text>
    <text x="10" y="60" fill="#94a3b8" font-family="monospace" font-size="8.5">3. 10x24 MM SLOTTED HOLE ON BASE FLANGE.</text>
    <text x="10" y="74" fill="#10b981" font-family="monospace" font-size="8.5">4. EXTRUDED CUT NORMAL TO PROFILE.</text>
  </g>

  <!-- 3D Isometric Preview Inset -->
  <g transform="translate(635, 45)">
    <rect width="180" height="150" fill="rgba(8, 14, 24, 0.9)" stroke="#0284c7" stroke-width="1.2"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">ISOMETRIC VIEW (3D)</text>
    <text x="10" y="27" fill="#64748b" font-family="monospace" font-size="7.5">SOLIDWORKS SOLID BODY</text>

    <!-- 3D Iso Render of F-Bracket -->
    <g transform="translate(90, 85) scale(0.55)">
      <!-- F Profile in 3D Axonometric -->
      <polygon points="-40,40 -40,-45 -15,-45 -15,-20 15,-20 15,-5 -15,-5 -15,15 25,15 25,40" fill="#1e3a5f" stroke="#00f2fe" stroke-width="2"/>
      <!-- Extruded Faces (Side & Top) -->
      <polygon points="-40,-45 0,-65 25,-65 -15,-45" fill="#2d5b88" stroke="#00f2fe" stroke-width="1.8"/>
      <polygon points="15,-20 55,-40 55,-25 15,-5" fill="#0f2b48" stroke="#00f2fe" stroke-width="1.8"/>
      <polygon points="25,15 65,-5 65,20 25,40" fill="#0f2b48" stroke="#00f2fe" stroke-width="1.8"/>
    </g>
    <text x="10" y="142" fill="#f59e0b" font-family="monospace" font-size="8">EXTRUSION LENGTH: 90.00 MM</text>
  </g>

  <!-- ==================== FRONT VIEW: F-SHAPED SKETCH ==================== -->
  <g transform="translate(200, 240)">
    <text x="-140" y="-195" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold">FRONT VIEW // پروفیل اصلی قطعه F</text>
    <text x="-140" y="-182" fill="#64748b" font-family="monospace" font-size="9">SKETCH ON FRONT PLANE // EXTRUDED BOSS/BASE</text>

    <!-- F-Profile Closed Loop -->
    <polygon points="-50,70 -50,-100 -18,-100 -18,-50 25,-50 25,-25 -18,-25 -18,15 35,15 35,70" fill="rgba(14, 165, 233, 0.08)" stroke="#00f2fe" stroke-width="2.4" filter="url(#glow4)"/>

    <!-- Vertical Centerline -->
    <line x1="-50" y1="-120" x2="-50" y2="90" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>

    <!-- Dimensions -->
    <!-- Total Height 93.00 (from -100 to 70 is 170 in svg units -> scaled) -->
    <line x1="-75" y1="-100" x2="-75" y2="70" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrStart4)" marker-end="url(#arrEnd4)"/>
    <line x1="-50" y1="-100" x2="-80" y2="-100" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="-50" y1="70" x2="-80" y2="70" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="-85" y="-10" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">93.00</text>

    <!-- Base Width 50.00 -->
    <line x1="-50" y1="88" x2="35" y2="88" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrStart4)" marker-end="url(#arrEnd4)"/>
    <line x1="-50" y1="70" x2="-50" y2="92" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="35" y1="70" x2="35" y2="92" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="-7" y="102" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">50.00</text>

    <!-- Top Arm Width 32.00 -->
    <line x1="-18" y1="-115" x2="25" y2="-115" stroke="#f59e0b" stroke-width="1" marker-start="url(#arrStart4)" marker-end="url(#arrEnd4)"/>
    <text x="3" y="-120" fill="#f59e0b" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">32.00</text>

    <!-- Wall Thickness 18.00 -->
    <line x1="-50" y1="-75" x2="-18" y2="-75" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart4)" marker-end="url(#arrEnd4)"/>
    <text x="-34" y="-80" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">18.00</text>

    <!-- Middle Step Height 28.00 -->
    <line x1="45" y1="-50" x2="45" y2="-25" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart4)" marker-end="url(#arrEnd4)"/>
    <text x="50" y="-35" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">28.00</text>

    <!-- Bottom Leg Height 55.00 -->
    <line x1="50" y1="15" x2="50" y2="70" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart4)" marker-end="url(#arrEnd4)"/>
    <text x="55" y="45" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">55.00</text>
  </g>

  <!-- ==================== SIDE VIEW: EXTRUSION & CUT VIEW ==================== -->
  <g transform="translate(450, 240)">
    <text x="-40" y="-195" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold">RIGHT VIEW // نمای جانبی با حجم ۹۰ میلی‌متر</text>
    <text x="-40" y="-182" fill="#64748b" font-family="monospace" font-size="9">PLANE: RIGHT PLANE // EXTRUSION DEPTH 90.00</text>

    <!-- Side View Block with Angled Cut at Top -->
    <polygon points="-30,70 -30,-60 20,-100 80,-100 80,70" fill="none" stroke="#00f2fe" stroke-width="2.2"/>
    <!-- Hidden Lines for Internal Steps -->
    <line x1="-30" y1="-25" x2="80" y2="-25" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>
    <line x1="-30" y1="15" x2="80" y2="15" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>

    <!-- Total Extrusion Depth Dimension: 90.00 -->
    <line x1="-30" y1="88" x2="80" y2="88" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrStart4)" marker-end="url(#arrEnd4)"/>
    <text x="25" y="102" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">90.00</text>

    <!-- Angle Dimension 35.0° -->
    <path d="M 0 -80 A 30 30 0 0 1 18 -68" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="-10" y="-85" fill="#f59e0b" font-family="monospace" font-size="9.5" font-weight="bold">35.0° CUT</text>

    <!-- Flatness GD&T -->
    <g transform="translate(0, 115)">
      <rect width="65" height="18" fill="rgba(15, 23, 42, 0.95)" stroke="#38bdf8" stroke-width="1"/>
      <line x1="22" y1="0" x2="22" y2="18" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="11" y="13" fill="#f59e0b" font-family="monospace" font-size="12" text-anchor="middle">⏥</text>
      <text x="43" y="12.5" fill="#f8fafc" font-family="monospace" font-size="9" text-anchor="middle">0.05</text>
    </g>
  </g>
</svg>
