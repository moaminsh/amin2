    <line x1="115" y1="-50" x2="115" y2="-68" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrSec10)"/>
    <text x="112" y="-72" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">Q</text>

