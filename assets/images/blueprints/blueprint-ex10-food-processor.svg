    <rect width="270" height="85" fill="rgba(10, 18, 30, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9.5" font-weight="bold">TECHNICAL NOTES // مـلاحظـات فـنـی:</text>
    <text x="10" y="32" fill="#94a3b8" font-family="monospace" font-size="8.5">1. HOUSING PROFILE WIDTH 90.20 MM, HEIGHT 70.00 MM.</text>
    <text x="10" y="46" fill="#94a3b8" font-family="monospace" font-size="8.5">2. COMPOUND CONVEX BLEND R59.16 MM &amp; R12.50 MM.</text>
