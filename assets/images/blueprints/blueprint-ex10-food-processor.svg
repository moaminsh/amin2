    <line x1="30" y1="22" x2="30" y2="135" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="160" y1="22" x2="160" y2="135" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="195" y1="22" x2="195" y2="135" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
