      <text x="14" y="-6" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    </g>

    <!-- ==================== DIMENSIONS ==================== -->
    <!-- Total Width 90.20 -->
    <line x1="-70" y1="72" x2="60" y2="72" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrStart10)" marker-end="url(#arrEnd10)"/>
    <line x1="-70" y1="50" x2="-70" y2="76" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="60" y1="50" x2="60" y2="76" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="-5" y="86" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">90.20 ±0.1</text>

    <!-- Total Height 70.00 -->
    <line x1="-95" y1="-95" x2="-95" y2="50" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrStart10)" marker-end="url(#arrEnd10)"/>
    <line x1="-70" y1="-95" x2="-98" y2="-95" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="-70" y1="50" x2="-98" y2="50" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="-105" y="-18" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">70.00</text>

    <!-- Base Step 37.00 -->
    <line x1="75" y1="0" x2="75" y2="50" stroke="#f59e0b" stroke-width="1" marker-start="url(#arrStart10)" marker-end="url(#arrEnd10)"/>
    <text x="82" y="28" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">37.00</text>

    <!-- Radius R59.16 Callout -->
    <line x1="-10" y1="-65" x2="40" y2="-90" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart10)"/>
    <line x1="40" y1="-90" x2="110" y2="-90" stroke="#38bdf8" stroke-width="1"/>
    <text x="42" y="-95" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold">R59.16 CONVEX ARC</text>

    <!-- GD&T Position & Perpendicularity Frame -->
    <g transform="translate(140, -45)">
