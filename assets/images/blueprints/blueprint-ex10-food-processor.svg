    <text x="14" y="55" fill="#f8fafc" font-family="monospace" font-size="9" text-anchor="middle">1</text>
    <text x="36" y="55" fill="#f8fafc" font-family="monospace" font-size="9">Upper Main Housing</text>
    <text x="178" y="55" fill="#f8fafc" font-family="monospace" font-size="9" text-anchor="middle">1</text>
    <text x="202" y="55" fill="#94a3b8" font-family="monospace" font-size="8.5">ABS Polymer</text>
    <text x="292" y="55" fill="#94a3b8" font-family="monospace" font-size="8.5">$14.50</text>
    <text x="340" y="55" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">$14.50</text>

    <!-- Row 2: Drive Shaft Bushing -->
