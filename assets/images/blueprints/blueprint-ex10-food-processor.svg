    <text x="14" y="79" fill="#f8fafc" font-family="monospace" font-size="9" text-anchor="middle">2</text>
    <text x="36" y="79" fill="#f8fafc" font-family="monospace" font-size="9">Shaft Sleeve Bushing</text>
    <text x="178" y="79" fill="#f8fafc" font-family="monospace" font-size="9" text-anchor="middle">2</text>
    <text x="202" y="79" fill="#94a3b8" font-family="monospace" font-size="8.5">Bronze SAE 660</text>
    <text x="292" y="79" fill="#94a3b8" font-family="monospace" font-size="8.5">$3.20</text>
    <text x="340" y="79" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">$6.40</text>

