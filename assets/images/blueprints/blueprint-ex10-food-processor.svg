      <line x1="22" y1="0" x2="22" y2="18" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="68" y1="0" x2="68" y2="18" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="90" y1="0" x2="90" y2="18" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="11" y="13" fill="#f59e0b" font-family="monospace" font-size="12" text-anchor="middle">⌖</text>
      <text x="45" y="12.5" fill="#f8fafc" font-family="monospace" font-size="9" text-anchor="middle">Ø 0.1 Ⓜ</text>
