<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <pattern id="grid10" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="0.8"/>
    </pattern>
    <pattern id="hatch10" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(0, 242, 254, 0.45)" stroke-width="1"/>
    </pattern>
    <filter id="glow10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#080e18"/>
  <rect width="600" height="420" fill="url(#grid10)"/>
  
  <rect x="12" y="12" width="576" height="396" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.6"/>
  <rect x="16" y="16" width="568" height="388" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="0.8"/>

  <!-- ISO Engineering Title Block -->
  <g transform="translate(350, 335)">
    <rect width="230" height="65" fill="rgba(15, 23, 42, 0.95)" stroke="#0284c7" stroke-width="1.2"/>
    <line x1="0" y1="22" x2="230" y2="22" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="0" y1="44" x2="230" y2="44" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="115" y1="0" x2="115" y2="65" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="8" y="15" fill="#94a3b8" font-family="monospace" font-size="9">FOOD PROCESSOR</text>
    <text x="122" y="15" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">DWG NO: FP-402</text>
    <text x="8" y="36" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">SHEET 4 OF 4</text>
    <text x="122" y="36" fill="#38bdf8" font-family="monospace" font-size="9">SCALE 1:2 // MM</text>
    <text x="8" y="58" fill="#10b981" font-family="monospace" font-size="9">GD&amp;T PER ASME Y14.5</text>
    <text x="122" y="58" fill="#f59e0b" font-family="monospace" font-size="9">BOM INCLUDED</text>
  </g>

  <!-- Left: Main Orthographic & Section Q-Q View -->
  <g transform="translate(35, 35)">
    <text x="0" y="14" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// SECTION Q-Q &amp; GD&amp;T CONTROLS</text>

    <!-- Main Food Processor Housing Body Outline -->
    <!-- Dimensions: Width 90.20, Height 70, base step 37, arcs R59.16 & R12.50 -->
    <path d="M 30 180 
             L 165 180 
             L 165 130 
             Q 155 100 135 60 
             A 25 25 0 0 0 100 45 
             L 50 45 
             Q 30 70 30 110 Z" 
          fill="none" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow10)"/>

    <!-- Section Cut Q-Q Hatching -->
    <path d="M 30 180 L 165 180 L 165 155 L 75 155 L 75 110 L 30 110 Z" fill="url(#hatch10)" stroke="#00f2fe" stroke-width="1.8"/>

    <!-- Section Cutting Plane Line Q-Q (Thick chain line) -->
    <line x1="15" y1="110" x2="185" y2="110" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="12,4,3,4"/>
    <!-- Arrows for Section Q-Q -->
    <polygon points="15,110 25,104 25,116" fill="#f43f5e"/>
    <polygon points="185,110 175,104 175,116" fill="#f43f5e"/>
    <text x="5" y="105" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">Q</text>
    <text x="190" y="105" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">Q</text>

    <!-- GD&T Feature Control Frame: Perpendicularity 0.5 to Datum A -->
    <g transform="translate(30, 205)">
      <rect width="80" height="20" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
      <line x1="26" y1="0" x2="26" y2="20" stroke="#38bdf8" stroke-width="1"/>
      <line x1="56" y1="0" x2="56" y2="20" stroke="#38bdf8" stroke-width="1"/>
      <!-- Perpendicular symbol ⟂ -->
      <line x1="13" y1="5" x2="13" y2="15" stroke="#f59e0b" stroke-width="1.6"/>
      <line x1="7" y1="15" x2="19" y2="15" stroke="#f59e0b" stroke-width="1.6"/>
      <!-- Tolerance 0.5 -->
      <text x="30" y="14" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">0.5</text>
      <!-- Datum Reference A -->
      <text x="64" y="14" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">A</text>
    </g>

    <!-- Datum Feature A Marker -->
    <g transform="translate(145, 180)">
      <polygon points="0,0 8,12 -8,12" fill="#38bdf8"/>
      <line x1="0" y1="12" x2="0" y2="22" stroke="#38bdf8" stroke-width="1.4"/>
      <rect x="-10" y="22" width="20" height="18" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="-4" y="35" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">A</text>
    </g>

    <!-- Dimensions: 90.20, 70, R59.16 -->
    <text x="80" y="196" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">90.20</text>
    <text x="175" y="150" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">H: 70</text>
    <text x="85" y="40" fill="#94a3b8" font-family="monospace" font-size="9">R59.16 / R12.50</text>
  </g>

  <!-- Right: Bill of Materials (BOM) Table + Auto Balloons -->
  <g transform="translate(285, 35)">
    <text x="0" y="14" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// BILL OF MATERIALS (BOM) TABLE</text>

    <!-- Table Header -->
    <g transform="translate(0, 25)">
      <rect width="280" height="22" fill="rgba(14, 165, 233, 0.25)" stroke="#0284c7" stroke-width="1"/>
      <text x="6" y="15" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">ITEM</text>
      <text x="40" y="15" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">PART NAME</text>
      <text x="130" y="15" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">QTY</text>
      <text x="165" y="15" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">PRICE ($)</text>
      <text x="225" y="15" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">COST ($)</text>
    </g>
    <!-- Row 1 -->
    <g transform="translate(0, 47)">
      <rect width="280" height="20" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="0.8"/>
      <text x="12" y="14" fill="#f8fafc" font-family="monospace" font-size="9">1</text>
      <text x="40" y="14" fill="#f8fafc" font-family="monospace" font-size="9">Main Housing</text>
      <text x="138" y="14" fill="#38bdf8" font-family="monospace" font-size="9">1</text>
      <text x="175" y="14" fill="#94a3b8" font-family="monospace" font-size="9">45.00</text>
      <text x="235" y="14" fill="#f59e0b" font-family="monospace" font-size="9">45.00</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0, 67)">
      <rect width="280" height="20" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="0.8"/>
      <text x="12" y="14" fill="#f8fafc" font-family="monospace" font-size="9">2</text>
      <text x="40" y="14" fill="#f8fafc" font-family="monospace" font-size="9">Drive Motor</text>
      <text x="138" y="14" fill="#38bdf8" font-family="monospace" font-size="9">1</text>
      <text x="175" y="14" fill="#94a3b8" font-family="monospace" font-size="9">85.00</text>
      <text x="235" y="14" fill="#f59e0b" font-family="monospace" font-size="9">85.00</text>
    </g>
    <!-- Row 3 -->
    <g transform="translate(0, 87)">
      <rect width="280" height="20" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="0.8"/>
      <text x="12" y="14" fill="#f8fafc" font-family="monospace" font-size="9">3</text>
      <text x="40" y="14" fill="#f8fafc" font-family="monospace" font-size="9">Stainless Blade</text>
      <text x="138" y="14" fill="#38bdf8" font-family="monospace" font-size="9">2</text>
      <text x="175" y="14" fill="#94a3b8" font-family="monospace" font-size="9">12.50</text>
      <text x="235" y="14" fill="#f59e0b" font-family="monospace" font-size="9">25.00</text>
    </g>
    <!-- Total Cost Equation Row -->
    <g transform="translate(0, 107)">
      <rect width="280" height="22" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
      <text x="40" y="15" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">EQUATION: `QTY` * `Price`</text>
      <text x="225" y="15" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">$155.00</text>
    </g>

    <!-- Auto Balloon Indicators: (1), (2), (3) with Leader Lines -->
    <g transform="translate(30, 150)">
      <text x="0" y="14" fill="#00f2fe" font-family="monospace" font-size="10" font-weight="bold">// AUTO-BALLOON CALLOUTS</text>

      <!-- Balloon 1 -->
      <line x1="20" y1="40" x2="-80" y2="40" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="20" cy="40" r="12" fill="rgba(8, 14, 24, 0.95)" stroke="#f59e0b" stroke-width="1.8"/>
      <text x="16" y="44" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">1</text>

      <!-- Balloon 2 -->
      <line x1="80" y1="70" x2="-20" y2="70" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="80" cy="70" r="12" fill="rgba(8, 14, 24, 0.95)" stroke="#f59e0b" stroke-width="1.8"/>
      <text x="76" y="74" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">2</text>

      <!-- Balloon 3 -->
      <line x1="140" y1="100" x2="20" y2="100" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="140" cy="100" r="12" fill="rgba(8, 14, 24, 0.95)" stroke="#f59e0b" stroke-width="1.8"/>
      <text x="136" y="104" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">3</text>
    </g>
  </g>
</svg>
