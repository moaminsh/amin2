      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="0.75"/>
    </pattern>
    <pattern id="cadGridMajor10" width="100" height="100" patternUnits="userSpaceOnUse">
