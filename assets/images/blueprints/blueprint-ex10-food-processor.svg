    <marker id="arrSec10" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 Z" fill="#f43f5e"/>
    </marker>
    <filter id="glow10" x="-10%" y="-10%" width="120%" height="120%">
