<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <pattern id="grid6" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="0.8"/>
    </pattern>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#080e18"/>
  <rect width="600" height="420" fill="url(#grid6)"/>
  
  <rect x="12" y="12" width="576" height="396" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <rect x="16" y="16" width="568" height="388" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="0.8"/>

  <!-- Title Block -->
  <g transform="translate(370, 340)">
    <rect width="210" height="60" fill="rgba(15, 23, 42, 0.9)" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="20" x2="210" y2="20" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="0" y1="40" x2="210" y2="40" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="105" y1="0" x2="105" y2="60" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="8" y="14" fill="#94a3b8" font-family="monospace" font-size="9">EX-06 // 3D PART</text>
    <text x="112" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">SCALE 1:1</text>
    <text x="8" y="34" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">CHAMFERED V-BLOCK</text>
    <text x="112" y="34" fill="#38bdf8" font-family="monospace" font-size="9">UNITS: MM</text>
    <text x="8" y="54" fill="#38bdf8" font-family="monospace" font-size="9">U-CHANNEL &amp; CHAMF</text>
    <text x="112" y="54" fill="#10b981" font-family="monospace" font-size="9">SOLIDWORKS CAD</text>
  </g>

  <!-- Left: Front View Cross-Section -->
  <g transform="translate(50, 50)">
    <text x="0" y="14" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// FRONT VIEW &amp; CHAMFERS</text>
    
    <!-- Trapezoid Profile with U-Channel -->
    <!-- Base 68 (scale 2.5px/mm -> 170px), top 48 (120px), height 42 (105px) -->
    <!-- U-channel width 18 (45px), depth 20 (50px) -->
    <path d="M 30 200 
             L 200 200 
             L 175 95 
             L 138 95 
             L 138 145 
             L 92 145 
             L 92 95 
             L 55 95 Z" 
          fill="rgba(14, 165, 233, 0.1)" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow6)"/>

    <!-- Chamfers: 15x18 at top slopes -->
    <line x1="55" y1="95" x2="68" y2="120" stroke="#f59e0b" stroke-width="1.8"/>
    <line x1="175" y1="95" x2="162" y2="120" stroke="#f59e0b" stroke-width="1.8"/>
    <!-- Bottom Chamfer 5x68 -->
    <line x1="30" y1="188" x2="42" y2="200" stroke="#f59e0b" stroke-width="1.8"/>
    <line x1="200" y1="188" x2="188" y2="200" stroke="#f59e0b" stroke-width="1.8"/>

    <!-- Base 68 Dimension -->
    <line x1="30" y1="216" x2="200" y2="216" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="30,216 38,213 38,219" fill="#38bdf8"/>
    <polygon points="200,216 192,213 192,219" fill="#38bdf8"/>
    <text x="110" y="230" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">BASE: 68</text>

    <!-- Top Width 48 -->
    <line x1="55" y1="80" x2="175" y2="80" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="55,80 63,77 63,83" fill="#38bdf8"/>
    <polygon points="175,80 167,77 167,83" fill="#38bdf8"/>
    <text x="105" y="74" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">48</text>

    <!-- Height 42 -->
    <line x1="15" y1="95" x2="15" y2="200" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="15,95 12,103 18,103" fill="#38bdf8"/>
    <polygon points="15,200 12,192 18,192" fill="#38bdf8"/>
    <text x="0" y="152" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">42</text>

    <!-- Channel Width 18 -->
    <line x1="92" y1="130" x2="138" y2="130" stroke="#f59e0b" stroke-width="1"/>
    <text x="103" y="125" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">W: 18</text>
  </g>

  <!-- Right: 3D Isometric View with Chamfers -->
  <g transform="translate(330, 50)">
    <text x="0" y="14" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// 3D ISOMETRIC SOLID</text>

    <!-- Isometric Chamfered Block -->
    <!-- Front Face -->
    <polygon points="40,160 80,135 110,135 110,165 130,165 130,135 160,135 200,160 200,195 40,195" 
             fill="rgba(14, 165, 233, 0.25)" stroke="#00f2fe" stroke-width="2"/>
    
    <!-- Top Chamfer Faces -->
    <polygon points="80,135 130,105 150,105 110,135" fill="rgba(56, 189, 248, 0.4)" stroke="#38bdf8" stroke-width="1.6"/>
    <polygon points="130,135 170,105 190,105 160,135" fill="rgba(56, 189, 248, 0.4)" stroke="#38bdf8" stroke-width="1.6"/>

    <!-- Sloped Chamfer Faces -->
    <polygon points="40,160 80,135 130,105 90,130" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="1.6"/>
    <polygon points="160,135 200,160 240,130 200,105" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="1.6"/>

    <!-- Side Right Face -->
    <polygon points="200,160 240,130 240,165 200,195" fill="rgba(2, 132, 199, 0.3)" stroke="#00f2fe" stroke-width="1.8"/>

    <!-- Chamfer Callouts -->
    <text x="30" y="240" fill="#f59e0b" font-family="monospace" font-size="10">CHAMF 1: 15 × 18 MM</text>
    <text x="30" y="256" fill="#f59e0b" font-family="monospace" font-size="10">CHAMF 2: 12 × 15 MM // BASE: 5 × 68</text>
  </g>
</svg>
