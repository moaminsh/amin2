      <text x="170" y="55">1</text>
      <text x="200" y="55">AL 6061-T6</text>
      <text x="275" y="55">FIXED</text>
      <line x1="5" y1="60" x2="332" y2="60" stroke="rgba(56, 189, 248, 0.2)" stroke-width="0.6"/>

