  <!-- Technical Notes -->
  <g transform="translate(35, 472)">
    <rect width="270" height="85" fill="rgba(10, 18, 30, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9.5" font-weight="bold">TECHNICAL NOTES // مـلاحظـات فـنـی:</text>
    <text x="10" y="32" fill="#94a3b8" font-family="monospace" font-size="8.5">1. STROKE S = 2 * R = 56.00 MM (BETWEEN TDC &amp; BDC).</text>
    <text x="10" y="46" fill="#94a3b8" font-family="monospace" font-size="8.5">2. REVOLUTE PIN FITS: Ø6 H7/h6 RUNNING CLEARANCE.</text>
    <text x="10" y="60" fill="#94a3b8" font-family="monospace" font-size="8.5">3. SLIDER PRISMATIC JOINT FLATNESS &lt; 0.01 MM.</text>
    <text x="10" y="74" fill="#10b981" font-family="monospace" font-size="8.5">4. TEST DYNAMIC KINEMATIC FREEDOM IN SOLIDWORKS MOTION.</text>
  </g>

