<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <pattern id="grid9" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="0.8"/>
    </pattern>
    <marker id="arr9" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <filter id="glow9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#080e18"/>
  <rect width="600" height="420" fill="url(#grid9)"/>
  
  <rect x="12" y="12" width="576" height="396" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <rect x="16" y="16" width="568" height="388" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="0.8"/>

  <!-- Title Block -->
  <g transform="translate(370, 340)">
    <rect width="210" height="60" fill="rgba(15, 23, 42, 0.9)" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="20" x2="210" y2="20" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="0" y1="40" x2="210" y2="40" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="105" y1="0" x2="105" y2="60" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="8" y="14" fill="#94a3b8" font-family="monospace" font-size="9">EX-09 // ASSEMBLY</text>
    <text x="112" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">SCALE 1:1</text>
    <text x="8" y="34" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">SLIDER-CRANK</text>
    <text x="112" y="34" fill="#38bdf8" font-family="monospace" font-size="9">UNITS: MM</text>
    <text x="8" y="54" fill="#38bdf8" font-family="monospace" font-size="9">KINEMATIC MATES</text>
    <text x="112" y="54" fill="#10b981" font-family="monospace" font-size="9">CONCENTRIC</text>
  </g>

  <!-- Kinematic Assembly Diagram -->
  <g transform="translate(50, 60)">
    <text x="0" y="14" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// KINEMATIC ASSEMBLY DIAGRAM &amp; COMPONENT MATES</text>

    <!-- Linear Guide Rail 100mm (Fixed Base [f]) -->
    <g transform="translate(180, 160)">
      <rect x="0" y="-12" width="220" height="24" fill="rgba(30, 41, 59, 0.8)" stroke="#64748b" stroke-width="1.8"/>
      <!-- Linear rail hatched ground symbol -->
      <line x1="0" y1="12" x2="220" y2="12" stroke="#64748b" stroke-width="1.2"/>
      <line x1="20" y1="12" x2="10" y2="24" stroke="#475569" stroke-width="1"/>
      <line x1="60" y1="12" x2="50" y2="24" stroke="#475569" stroke-width="1"/>
      <line x1="100" y1="12" x2="90" y2="24" stroke="#475569" stroke-width="1"/>
      <line x1="140" y1="12" x2="130" y2="24" stroke="#475569" stroke-width="1"/>
      <line x1="180" y1="12" x2="170" y2="24" stroke="#475569" stroke-width="1"/>

      <text x="70" y="5" fill="#94a3b8" font-family="monospace" font-size="10">GUIDE RAIL 100 (f)</text>
      <!-- Fixed Badge (f) -->
      <rect x="225" y="-10" width="24" height="20" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
      <text x="230" y="4" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">(f)</text>

      <!-- Slider Block 10x10x10 sliding on rail -->
      <rect x="120" y="-28" width="45" height="28" fill="rgba(14, 165, 233, 0.2)" stroke="#00f2fe" stroke-width="2" filter="url(#glow9)"/>
      <circle cx="142.5" cy="-14" r="5" fill="#080e18" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="110" y="-35" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">SLIDER [COINCIDENT]</text>
    </g>

    <!-- Crank Center (Pivot Pin O at (80, 160)) -->
    <g transform="translate(80, 160)">
      <circle cx="0" cy="0" r="10" fill="rgba(8, 14, 24, 0.9)" stroke="#f43f5e" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#ef4444"/>
      <text x="-25" y="24" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold">CRANK PIVOT O</text>

      <!-- Crank Rotation Path Circle R28 -->
      <circle cx="0" cy="0" r="60" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3"/>

      <!-- Crank Arm (Length 28 -> 60px scaled, at angle ~55 deg) -->
      <!-- Cos(55) = 0.573, Sin(55) = 0.819 -> (34.4, -49.1) -->
      <line x1="0" y1="0" x2="35" y2="-50" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="35" cy="-50" r="7" fill="rgba(8, 14, 24, 0.9)" stroke="#f59e0b" stroke-width="2"/>
      <text x="5" y="-55" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">CRANK L=28</text>

      <!-- Rotation Direction Arrow -->
      <path d="M 45 -20 A 50 50 0 0 0 10 -48" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr9)"/>
      <text x="52" y="-30" fill="#f59e0b" font-family="monospace" font-size="9">ω</text>
    </g>

    <!-- Connecting Rod Link (Connecting Crank Pin (115, 110) to Slider Pin (322.5, 146)) -->
    <!-- Distance ~210px (representing L=58mm) -->
    <path d="M 115 110 L 322.5 146" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="115" cy="110" r="7" fill="rgba(8, 14, 24, 0.9)" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="322.5" cy="146" r="7" fill="rgba(8, 14, 24, 0.9)" stroke="#00f2fe" stroke-width="2"/>
    <text x="180" y="115" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">CONNECTING ROD (L=58)</text>

    <!-- Motion Arrow on Slider (Horizontal Reciprocating ⇄) -->
    <g transform="translate(322.5, 120)">
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#10b981" stroke-width="2"/>
      <polygon points="-35,0 -27,-4 -27,4" fill="#10b981"/>
      <polygon points="35,0 27,-4 27,4" fill="#10b981"/>
      <text x="-40" y="-8" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">RECIPROCATING STROKE</text>
    </g>

    <!-- Mechanical Mates Summary Box -->
    <g transform="translate(10, 215)">
      <rect width="280" height="42" rx="4" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="10" y="16" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">MATE 1: RAIL TO ORIGIN (FIXED)</text>
      <text x="10" y="32" fill="#10b981" font-family="monospace" font-size="9">MATE 2: SLIDER ON RAIL (COINCIDENT)</text>
      <text x="175" y="32" fill="#f59e0b" font-family="monospace" font-size="9">MATE 3: PINS (CONCENTRIC)</text>
    </g>
  </g>
</svg>
