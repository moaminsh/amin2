<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="100%" height="100%">
  <defs>
    <pattern id="cadGrid9" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="0.75"/>
    </pattern>
    <pattern id="cadGridMajor9" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1"/>
    </pattern>
    <marker id="arrEnd9" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrStart9" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 2 L 0 5 L 10 8 Z" fill="#38bdf8"/>
    </marker>
    <filter id="glow9" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="840" height="580" fill="#060b13" class="cad-bg"/>
  <rect width="840" height="580" fill="url(#cadGrid9)" class="cad-grid"/>
  <rect width="840" height="580" fill="url(#cadGridMajor9)" class="cad-grid-major"/>

  <rect x="18" y="16" width="804" height="548" fill="none" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="23" y="21" width="794" height="538" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="0.8"/>

  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">
    <text x="73" y="14">1</text><text x="73" y="570">1</text>
    <text x="173" y="14">2</text><text x="173" y="570">2</text>
    <text x="273" y="14">3</text><text x="273" y="570">3</text>
    <text x="373" y="14">4</text><text x="373" y="570">4</text>
    <text x="473" y="14">5</text><text x="473" y="570">5</text>
    <text x="573" y="14">6</text><text x="573" y="570">6</text>
    <text x="673" y="14">7</text><text x="673" y="570">7</text>
    <text x="773" y="14">8</text><text x="773" y="570">8</text>
  </g>
  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle" dominant-baseline="central">
    <text x="10" y="85">A</text><text x="830" y="85">A</text>
    <text x="10" y="220">B</text><text x="830" y="220">B</text>
    <text x="10" y="355">C</text><text x="830" y="355">C</text>
    <text x="10" y="490">D</text><text x="830" y="490">D</text>
  </g>

  <!-- Title Block (ISO 7200) -->
  <g transform="translate(480, 440)">
    <rect width="337" height="119" fill="rgba(10, 18, 30, 0.95)" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="337" y2="28" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="56" x2="337" y2="56" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="84" x2="337" y2="84" stroke="#0284c7" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="84" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="245" y1="28" x2="245" y2="84" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="75" y1="84" x2="75" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="160" y1="84" x2="160" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="245" y1="84" x2="245" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>

    <text x="8" y="13" fill="#64748b" font-family="monospace" font-size="8">ORGANIZATION / LAB</text>
    <text x="8" y="23" fill="#00f2fe" font-family="monospace" font-size="10.5" font-weight="bold">M. SHARIF CAD ACADEMY</text>
    <text x="168" y="13" fill="#64748b" font-family="monospace" font-size="8">DRAWING NUMBER</text>
    <text x="168" y="24" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">MAS-SW-EX09-ASSY</text>

    <text x="8" y="41" fill="#64748b" font-family="monospace" font-size="8">TITLE / PART DESCRIPTION</text>
    <text x="8" y="52" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">SLIDER-CRANK ASSEMBLY</text>
    <text x="168" y="41" fill="#64748b" font-family="monospace" font-size="8">PROJECTION</text>
    <g transform="translate(185, 48)">
      <polygon points="0,4 0,-4 14,-7 14,7" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
      <line x1="-4" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="3,1.5"/>
      <circle cx="24" cy="0" r="4" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
      <circle cx="24" cy="0" r="7" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
    </g>
    <text x="252" y="41" fill="#64748b" font-family="monospace" font-size="8">TYPE</text>
    <text x="252" y="52" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="bold">ASSEMBLY</text>

    <text x="8" y="69" fill="#64748b" font-family="monospace" font-size="8">GENERAL TOLERANCE</text>
    <text x="8" y="80" fill="#94a3b8" font-family="monospace" font-size="9">ISO 2768-m (±0.1 mm)</text>
    <text x="168" y="69" fill="#64748b" font-family="monospace" font-size="8">CLEARANCE FIT</text>
    <text x="168" y="80" fill="#f8fafc" font-family="monospace" font-size="9">H7 / g6 SLIDING</text>
    <text x="252" y="69" fill="#64748b" font-family="monospace" font-size="8">TOTAL MASS</text>
    <text x="252" y="80" fill="#94a3b8" font-family="monospace" font-size="9">1.840 kg</text>

    <text x="8" y="97" fill="#64748b" font-family="monospace" font-size="7.5">DESIGNED BY</text>
    <text x="8" y="112" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">M. SHARIF</text>
    <text x="82" y="97" fill="#64748b" font-family="monospace" font-size="7.5">APPROVED</text>
    <text x="82" y="112" fill="#38bdf8" font-family="monospace" font-size="9">ENG. QA</text>
    <text x="168" y="97" fill="#64748b" font-family="monospace" font-size="7.5">SCALE</text>
    <text x="168" y="112" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">1:1 (A3)</text>
    <text x="252" y="97" fill="#64748b" font-family="monospace" font-size="7.5">STATUS</text>
    <text x="252" y="112" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">RELEASED</text>
  </g>

  <!-- Assembly Mates Directory Table (Lower Left) -->
  <g transform="translate(35, 435)">
    <rect width="320" height="122" fill="rgba(10, 18, 30, 0.95)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9.5" font-weight="bold">SOLIDWORKS ASSEMBLY MATES (قیود مونتاژ):</text>
    <line x1="0" y1="22" x2="320" y2="22" stroke="rgba(56, 189, 248, 0.25)" stroke-width="0.8"/>
    <text x="10" y="36" fill="#94a3b8" font-family="monospace" font-size="8.5">• MATE 1: GUIDE RAIL (1) (f) FIXED TO ASSEMBLY ORIGIN</text>
    <text x="10" y="52" fill="#94a3b8" font-family="monospace" font-size="8.5">• MATE 2: CRANK (2) CONCENTRIC &amp; COINCIDENT TO PIVOT O</text>
    <text x="10" y="68" fill="#94a3b8" font-family="monospace" font-size="8.5">• MATE 3: CONNECTING ROD (3) CONCENTRIC TO CRANK PIN</text>
    <text x="10" y="84" fill="#94a3b8" font-family="monospace" font-size="8.5">• MATE 4: ROD (3) CONCENTRIC TO SLIDER PISTON (4) PIN</text>
    <text x="10" y="100" fill="#10b981" font-family="monospace" font-size="8.5">• MATE 5: SLIDER (4) COINCIDENT &amp; PARALLEL TO RAIL</text>
    <text x="10" y="114" fill="#f59e0b" font-family="monospace" font-size="8.5">RECIPROCATING STROKE S = 2 * R = 56.00 MM</text>
  </g>

  <!-- 3D Isometric Assembly Inset -->
  <g transform="translate(635, 45)">
    <rect width="180" height="150" fill="rgba(8, 14, 24, 0.9)" stroke="#0284c7" stroke-width="1.2"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">ISOMETRIC ASSEMBLY (3D)</text>
    <text x="10" y="27" fill="#64748b" font-family="monospace" font-size="7.5">SOLIDWORKS 4-BAR MECHANISM</text>

    <g transform="translate(90, 85) scale(0.6)">
      <!-- Ground Rail 3D -->
      <polygon points="-50,30 50,30 65,15 -35,15" fill="#0f2b48" stroke="#00f2fe" stroke-width="1.5"/>
      <!-- Crank Arm 3D -->
      <line x1="-35" y1="15" x2="-20" y2="-20" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
      <!-- Connecting Rod 3D -->
      <line x1="-20" y1="-20" x2="25" y2="20" stroke="#00f2fe" stroke-width="5" stroke-linecap="round"/>
      <!-- Slider Block 3D -->
      <rect x="15" y="10" width="22" height="16" rx="2" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
    </g>
    <text x="10" y="142" fill="#f59e0b" font-family="monospace" font-size="8">1 DOF KINEMATIC CHAIN</text>
  </g>

  <!-- ==================== MAIN ASSEMBLY KINEMATIC SCHEMATIC ==================== -->
  <g transform="translate(250, 220)">
    <text x="-195" y="-175" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold">ASSEMBLY VIEW // مکانیزم مونتاژی لنگ و لغزنده</text>
    <text x="-195" y="-162" fill="#64748b" font-family="monospace" font-size="9">PLANE: FRONT PLANE // CENTERLINE OF RECIPROCATING SLIDER</text>

    <!-- Slider Horizontal Line of Action Axis -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="12,4,2,4"/>

    <!-- Ground Fixed Guide Rail Link (1) -->
    <rect x="30" y="-12" width="115" height="24" fill="rgba(15, 23, 42, 0.8)" stroke="#64748b" stroke-width="1.8"/>
    <text x="80" y="24" fill="#64748b" font-family="monospace" font-size="9" font-weight="bold">[1] GUIDE RAIL (f)</text>

    <!-- Crank Link (2) Pivot O at (-100, 0) -->
    <!-- Crank Rotation Circular Path (R=28) -->
    <circle cx="-100" cy="0" r="42" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="-100" y="-48" fill="#f59e0b" font-family="monospace" font-size="9" text-anchor="middle">CRANK RADIUS R=28.00</text>

    <!-- Crank Pivot O -->
    <circle cx="-100" cy="0" r="10" fill="#060b13" stroke="#f59e0b" stroke-width="2.2"/>
    <circle cx="-100" cy="0" r="4" fill="#f59e0b"/>
    <text x="-122" y="4" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">O</text>

    <!-- Crank Arm at 60° Angle (dx = 21, dy = -36.3) -> Crank Pin A at (-79, -36.3) -->
    <line x1="-100" y1="0" x2="-79" y2="-36.3" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-79" cy="-36.3" r="6" fill="#060b13" stroke="#f59e0b" stroke-width="2"/>
    <text x="-75" y="-44" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">A [2]</text>

    <!-- Connecting Rod Link (3) from A(-79, -36.3) to Slider Pin B(80, 0) -->
    <line x1="-79" y1="-36.3" x2="70" y2="0" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" filter="url(#glow9)"/>
    <circle cx="70" cy="0" r="6" fill="#060b13" stroke="#00f2fe" stroke-width="2"/>
    <text x="66" y="-12" fill="#00f2fe" font-family="monospace" font-size="10" font-weight="bold">B [3]</text>

    <!-- Slider Piston Block (4) centered at (70, 0) -->
    <rect x="52" y="-10" width="36" height="20" rx="3" fill="rgba(14, 165, 233, 0.25)" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="6" fill="#f8fafc" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">[4]</text>

    <!-- Stroke Dimension: S = 56.00 mm travel range -->
    <!-- Extreme Left Position (BDC) at x = -100 + 58 - 28 = -70 -> relative to slider x1=42, x2=98 -->
    <line x1="42" y1="-35" x2="98" y2="-35" stroke="#10b981" stroke-width="1.2" marker-start="url(#arrStart9)" marker-end="url(#arrEnd9)"/>
    <line x1="42" y1="-10" x2="42" y2="-38" stroke="#10b981" stroke-width="0.8"/>
    <line x1="98" y1="-10" x2="98" y2="-38" stroke="#10b981" stroke-width="0.8"/>
    <text x="70" y="-40" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STROKE S = 56.00 MM</text>

    <!-- Crank Length R28 Dimension -->
    <line x1="-100" y1="0" x2="-140" y2="-35" stroke="#f59e0b" stroke-width="1" marker-start="url(#arrStart9)"/>
    <line x1="-140" y1="-35" x2="-190" y2="-35" stroke="#f59e0b" stroke-width="1"/>
    <text x="-190" y="-40" fill="#f59e0b" font-family="monospace" font-size="9.5" font-weight="bold">CRANK R = 28.00</text>

    <!-- Rod Length L58 Dimension -->
    <line x1="-5" y1="-18" x2="25" y2="-70" stroke="#00f2fe" stroke-width="1" marker-start="url(#arrStart9)"/>
    <line x1="25" y1="-70" x2="105" y2="-70" stroke="#00f2fe" stroke-width="1"/>
    <text x="28" y="-75" fill="#00f2fe" font-family="monospace" font-size="10" font-weight="bold">ROD L = 58.00 ±0.05</text>
  </g>
</svg>
