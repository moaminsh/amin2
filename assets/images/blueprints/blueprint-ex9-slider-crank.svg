      <text x="0" y="3.5" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">4</text>
    </g>

    <!-- Stroke Dimension: S = 56.00 mm travel range -->
    <line x1="38" y1="-35" x2="94" y2="-35" stroke="#10b981" stroke-width="1.2" marker-start="url(#arrStart9)" marker-end="url(#arrEnd9)"/>
    <line x1="38" y1="-10" x2="38" y2="-38" stroke="#10b981" stroke-width="0.8"/>
    <line x1="94" y1="-10" x2="94" y2="-38" stroke="#10b981" stroke-width="0.8"/>
    <text x="66" y="-40" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STROKE S = 56.00 MM</text>

