<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="100%" height="100%">
  <defs>
    <pattern id="cadGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="0.75"/>
    </pattern>
    <pattern id="cadGridMajor2" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1"/>
    </pattern>
    <pattern id="hatch2" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <marker id="arrEnd2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrStart2" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 2 L 0 5 L 10 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrSec2" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 Z" fill="#f43f5e"/>
    </marker>
    <filter id="glow2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sheet Background -->
  <rect width="840" height="580" fill="#060b13" class="cad-bg"/>
  <rect width="840" height="580" fill="url(#cadGrid2)" class="cad-grid"/>
  <rect width="840" height="580" fill="url(#cadGridMajor2)" class="cad-grid-major"/>

  <!-- ISO Outer Border & Zone Coordinates -->
  <rect x="18" y="16" width="804" height="548" fill="none" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="23" y="21" width="794" height="538" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="0.8"/>

  <!-- Grid Zone Coordinates -->
  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">
    <text x="73" y="14">1</text><text x="73" y="570">1</text>
    <text x="173" y="14">2</text><text x="173" y="570">2</text>
    <text x="273" y="14">3</text><text x="273" y="570">3</text>
    <text x="373" y="14">4</text><text x="373" y="570">4</text>
    <text x="473" y="14">5</text><text x="473" y="570">5</text>
    <text x="573" y="14">6</text><text x="573" y="570">6</text>
    <text x="673" y="14">7</text><text x="673" y="570">7</text>
    <text x="773" y="14">8</text><text x="773" y="570">8</text>
  </g>
  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle" dominant-baseline="central">
    <text x="10" y="85">A</text><text x="830" y="85">A</text>
    <text x="10" y="220">B</text><text x="830" y="220">B</text>
    <text x="10" y="355">C</text><text x="830" y="355">C</text>
    <text x="10" y="490">D</text><text x="830" y="490">D</text>
  </g>

  <!-- Title Block (ISO 7200) -->
  <g transform="translate(480, 440)">
    <rect width="337" height="119" fill="rgba(10, 18, 30, 0.95)" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="337" y2="28" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="56" x2="337" y2="56" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="84" x2="337" y2="84" stroke="#0284c7" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="84" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="245" y1="28" x2="245" y2="84" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="75" y1="84" x2="75" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="160" y1="84" x2="160" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="245" y1="84" x2="245" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>

    <text x="8" y="13" fill="#64748b" font-family="monospace" font-size="8">ORGANIZATION / LAB</text>
    <text x="8" y="23" fill="#00f2fe" font-family="monospace" font-size="10.5" font-weight="bold">M. SHARIF CAD ACADEMY</text>
    <text x="168" y="13" fill="#64748b" font-family="monospace" font-size="8">DRAWING NUMBER</text>
    <text x="168" y="24" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">MAS-SW-EX02-REV.A</text>

    <text x="8" y="41" fill="#64748b" font-family="monospace" font-size="8">TITLE / PART DESCRIPTION</text>
    <text x="8" y="52" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">4-HOLE INDUSTRIAL FLANGE</text>
    <text x="168" y="41" fill="#64748b" font-family="monospace" font-size="8">PROJECTION</text>
    <!-- 3rd Angle Cone -->
    <g transform="translate(185, 48)">
      <polygon points="0,4 0,-4 14,-7 14,7" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
      <line x1="-4" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="3,1.5"/>
      <circle cx="24" cy="0" r="4" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
      <circle cx="24" cy="0" r="7" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
    </g>
    <text x="252" y="41" fill="#64748b" font-family="monospace" font-size="8">MATERIAL</text>
    <text x="252" y="52" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="bold">AISI 1045 C.S.</text>

    <text x="8" y="69" fill="#64748b" font-family="monospace" font-size="8">GENERAL TOLERANCE</text>
    <text x="8" y="80" fill="#94a3b8" font-family="monospace" font-size="9">ISO 2768-m (±0.1 mm)</text>
    <text x="168" y="69" fill="#64748b" font-family="monospace" font-size="8">SURFACE FINISH</text>
    <text x="168" y="80" fill="#f8fafc" font-family="monospace" font-size="9">Ra 3.2 µm ▽</text>
    <text x="252" y="69" fill="#64748b" font-family="monospace" font-size="8">WEIGHT (CALC)</text>
    <text x="252" y="80" fill="#94a3b8" font-family="monospace" font-size="9">1.120 kg</text>

    <text x="8" y="97" fill="#64748b" font-family="monospace" font-size="7.5">DESIGNED BY</text>
    <text x="8" y="112" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">M. SHARIF</text>
    <text x="82" y="97" fill="#64748b" font-family="monospace" font-size="7.5">APPROVED</text>
    <text x="82" y="112" fill="#38bdf8" font-family="monospace" font-size="9">ENG. QA</text>
    <text x="168" y="97" fill="#64748b" font-family="monospace" font-size="7.5">SCALE</text>
    <text x="168" y="112" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">1:1 (A3)</text>
    <text x="252" y="97" fill="#64748b" font-family="monospace" font-size="7.5">STATUS</text>
    <text x="252" y="112" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">RELEASED</text>
  </g>

  <!-- Technical Notes -->
  <g transform="translate(35, 472)">
    <rect width="270" height="85" fill="rgba(10, 18, 30, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9.5" font-weight="bold">TECHNICAL NOTES // مـلاحظـات فـنـی:</text>
    <text x="10" y="32" fill="#94a3b8" font-family="monospace" font-size="8.5">1. 4X HOLES Ø20 ON 60x60 PITCH SQUARE.</text>
    <text x="10" y="46" fill="#94a3b8" font-family="monospace" font-size="8.5">2. SYMMETRIC ANGLED SLOTS AT 30.0° ANGLE.</text>
    <text x="10" y="60" fill="#94a3b8" font-family="monospace" font-size="8.5">3. EXTERNAL CORNER RADII R18.00 ALL 4 CORNERS.</text>
    <text x="10" y="74" fill="#10b981" font-family="monospace" font-size="8.5">4. ALL GEOMETRIC RELATIONS FULLY CONSTRAINED.</text>
  </g>

  <!-- 3D Isometric Preview Inset -->
  <g transform="translate(635, 45)">
    <rect width="180" height="150" fill="rgba(8, 14, 24, 0.9)" stroke="#0284c7" stroke-width="1.2"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">ISOMETRIC VIEW (3D)</text>
    <text x="10" y="27" fill="#64748b" font-family="monospace" font-size="7.5">SOLIDWORKS SOLID BODY</text>

    <!-- 3D Iso Render of Square Flange -->
    <g transform="translate(90, 85) scale(0.65)">
      <!-- 3D Base Plate with Rounded Corners -->
      <polygon points="-50,-10 0,-35 50,-10 0,15" fill="#1e3a5f" stroke="#00f2fe" stroke-width="1.8"/>
      <polygon points="-50,-10 0,15 0,35 -50,10" fill="#0f2b48" stroke="#00f2fe" stroke-width="1.8"/>
      <polygon points="0,15 50,-10 50,10 0,35" fill="#0b1e33" stroke="#00f2fe" stroke-width="1.8"/>

      <!-- Center Bore Inset 3D -->
      <ellipse cx="0" cy="-10" rx="20" ry="10" fill="#060b13" stroke="#38bdf8" stroke-width="1.5"/>
      <ellipse cx="0" cy="-10" rx="12" ry="6" fill="#000000" stroke="#00f2fe" stroke-width="1.2"/>

      <!-- 4 Mounting Holes Inset (Iso) -->
      <ellipse cx="-25" cy="-15" rx="5" ry="3" fill="#060b13" stroke="#38bdf8" stroke-width="1.2"/>
      <ellipse cx="25" cy="-15" rx="5" ry="3" fill="#060b13" stroke="#38bdf8" stroke-width="1.2"/>
      <ellipse cx="-25" cy="5" rx="5" ry="3" fill="#060b13" stroke="#38bdf8" stroke-width="1.2"/>
      <ellipse cx="25" cy="5" rx="5" ry="3" fill="#060b13" stroke="#38bdf8" stroke-width="1.2"/>
    </g>
    <text x="10" y="142" fill="#f59e0b" font-family="monospace" font-size="8">THICKNESS: 16.00 MM</text>
  </g>

  <!-- ==================== MAIN VIEW: FRONT VIEW / 2D SKETCH ==================== -->
  <g transform="translate(255, 230)">
    <text x="-205" y="-185" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold">FRONT VIEW // نمای روبرو و اندازه‌های اصلی</text>
    <text x="-205" y="-172" fill="#64748b" font-family="monospace" font-size="9">AXES: HORIZONTAL &amp; VERTICAL CENTERLINES // FULLY CONSTRAINED</text>

    <!-- Cutting Plane Line B-B (Vertical) -->
    <line x1="0" y1="-170" x2="0" y2="-125" stroke="#f43f5e" stroke-width="2.5"/>
    <line x1="0" y1="-125" x2="0" y2="125" stroke="#f43f5e" stroke-width="1" stroke-dasharray="14,4,3,4"/>
    <line x1="0" y1="125" x2="0" y2="170" stroke="#f43f5e" stroke-width="2.5"/>
    <!-- Cutting Direction Arrows B-B (Pointing Left) -->
    <line x1="0" y1="-165" x2="-18" y2="-165" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrSec2)"/>
    <text x="-24" y="-168" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">B</text>
    <line x1="0" y1="165" x2="-18" y2="165" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrSec2)"/>
    <text x="-24" y="162" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">B</text>

    <!-- Center Axes -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="12,4,2,4" opacity="0.6"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="12,4,2,4" opacity="0.6"/>

    <!-- 30° Angular Centerline Rays -->
    <line x1="-120" y1="69.28" x2="120" y2="-69.28" stroke="#f43f5e" stroke-width="0.75" stroke-dasharray="8,3,2,3" opacity="0.6"/>
    <line x1="-120" y1="-69.28" x2="120" y2="69.28" stroke="#f43f5e" stroke-width="0.75" stroke-dasharray="8,3,2,3" opacity="0.6"/>

    <!-- Main Outer Body: Rounded Square Flange -->
    <rect x="-105" y="-105" width="210" height="210" rx="32" fill="rgba(14, 165, 233, 0.08)" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow2)"/>

    <!-- Center Step Bores -->
    <!-- Outer Counterbore Ø90 -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Inner Through Bore Ø55 -->
    <circle cx="0" cy="0" r="27.5" fill="#060b13" stroke="#00f2fe" stroke-width="2.2"/>

    <!-- 4 Mounting Holes (Ø20 on square 60x60 -> ±60, ±60) -->
    <!-- Hole 1: Top-Left (-60, -60) -->
    <circle cx="-60" cy="-60" r="10" fill="#060b13" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-65" y1="-60" x2="-55" y2="-60" stroke="#f43f5e" stroke-width="1"/>
    <line x1="-60" y1="-65" x2="-60" y2="-55" stroke="#f43f5e" stroke-width="1"/>

    <!-- Hole 2: Top-Right (60, -60) -->
    <circle cx="60" cy="-60" r="10" fill="#060b13" stroke="#38bdf8" stroke-width="2"/>
    <line x1="55" y1="-60" x2="65" y2="-60" stroke="#f43f5e" stroke-width="1"/>
    <line x1="60" y1="-65" x2="60" y2="-55" stroke="#f43f5e" stroke-width="1"/>

    <!-- Hole 3: Bottom-Left (-60, 60) -->
    <circle cx="-60" cy="60" r="10" fill="#060b13" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-65" y1="60" x2="-55" y2="60" stroke="#f43f5e" stroke-width="1"/>
    <line x1="-60" y1="55" x2="-60" y2="65" stroke="#f43f5e" stroke-width="1"/>

    <!-- Hole 4: Bottom-Right (60, 60) -->
    <circle cx="60" cy="60" r="10" fill="#060b13" stroke="#38bdf8" stroke-width="2"/>
    <line x1="55" y1="60" x2="65" y2="60" stroke="#f43f5e" stroke-width="1"/>
    <line x1="60" y1="55" x2="60" y2="65" stroke="#f43f5e" stroke-width="1"/>

    <!-- 4x Angled Keyway Slots at 30° (Width 8mm, Length 14mm) -->
    <rect x="24" y="-4" width="22" height="8" rx="2" transform="rotate(30)" fill="#060b13" stroke="#f59e0b" stroke-width="1.6"/>
    <rect x="24" y="-4" width="22" height="8" rx="2" transform="rotate(150)" fill="#060b13" stroke="#f59e0b" stroke-width="1.6"/>
    <rect x="24" y="-4" width="22" height="8" rx="2" transform="rotate(210)" fill="#060b13" stroke="#f59e0b" stroke-width="1.6"/>
    <rect x="24" y="-4" width="22" height="8" rx="2" transform="rotate(330)" fill="#060b13" stroke="#f59e0b" stroke-width="1.6"/>

    <!-- ==================== DIMENSIONS ==================== -->
    <!-- Pitch Square Dimension (120mm between hole centers) -->
    <line x1="-60" y1="-85" x2="60" y2="-85" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart2)" marker-end="url(#arrEnd2)"/>
    <line x1="-60" y1="-60" x2="-60" y2="-88" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="60" y1="-60" x2="60" y2="-88" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="0" y="-90" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">120.00 ±0.1</text>

    <!-- Pitch from Center (60mm) -->
    <line x1="-60" y1="0" x2="-60" y2="60" stroke="#f59e0b" stroke-width="0.8"/>
    <line x1="-90" y1="0" x2="-90" y2="60" stroke="#f59e0b" stroke-width="1" marker-start="url(#arrStart2)" marker-end="url(#arrEnd2)"/>
    <line x1="0" y1="0" x2="-93" y2="0" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="-95" y="34" fill="#f59e0b" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="end">60.00</text>

    <!-- 4X Hole Callout -->
    <line x1="60" y1="-60" x2="110" y2="-120" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart2)"/>
    <line x1="110" y1="-120" x2="175" y2="-120" stroke="#38bdf8" stroke-width="1"/>
    <text x="112" y="-124" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">4X Ø20 H8 THRU</text>

    <!-- Center Bores Ø90 & Ø55 -->
    <line x1="0" y1="0" x2="-75" y2="-35" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart2)"/>
    <line x1="-75" y1="-35" x2="-145" y2="-35" stroke="#38bdf8" stroke-width="1"/>
    <text x="-142" y="-45" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">BORE Ø55 H7 THRU</text>
    <text x="-142" y="-37" fill="#94a3b8" font-family="monospace" font-size="8.5">C-BORE Ø90 ↧ 6.00</text>

    <!-- Corner Radius 4X R18 -->
    <line x1="90" y1="90" x2="135" y2="110" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart2)"/>
    <line x1="135" y1="110" x2="185" y2="110" stroke="#38bdf8" stroke-width="1"/>
    <text x="138" y="106" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold">4X R18.00</text>

    <!-- Angle 30° Callout -->
    <path d="M 40 0 A 40 40 0 0 0 34.64 -20" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <text x="44" y="-8" fill="#f59e0b" font-family="monospace" font-size="9.5" font-weight="bold">30.0°</text>
  </g>

  <!-- ==================== SECTION B-B VIEW (RIGHT SIDE) ==================== -->
  <g transform="translate(560, 240)">
    <text x="-40" y="-35" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">SECTION B-B // برش مقطع عمودی</text>
    <text x="-40" y="-22" fill="#64748b" font-family="monospace" font-size="8">SCALE 1:1 // SHOWING COUNTERBORE &amp; SLOTS</text>

    <line x1="0" y1="-15" x2="0" y2="130" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>

    <!-- Left Flange Body (Hatched) -->
    <rect x="-85" y="10" width="57.5" height="18" fill="url(#hatch2)" stroke="#00f2fe" stroke-width="1.8"/>
    <!-- Left Mounting Hole Void -->
    <rect x="-65" y="10" width="10" height="18" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>

    <!-- Counterbore Shelf Step -->
    <rect x="-27.5" y="16" width="10" height="12" fill="url(#hatch2)" stroke="#00f2fe" stroke-width="1.8"/>

    <!-- Center Void (Through Hole Ø55) -->

    <!-- Right Counterbore Shelf Step -->
    <rect x="17.5" y="16" width="10" height="12" fill="url(#hatch2)" stroke="#00f2fe" stroke-width="1.8"/>
    <!-- Right Flange Body (Hatched) -->
    <rect x="27.5" y="10" width="57.5" height="18" fill="url(#hatch2)" stroke="#00f2fe" stroke-width="1.8"/>
    <!-- Right Mounting Hole Void -->
    <rect x="55" y="10" width="10" height="18" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>

    <!-- Height Dimensions -->
    <line x1="-95" y1="10" x2="-95" y2="28" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart2)" marker-end="url(#arrEnd2)"/>
    <text x="-135" y="22" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold">16.00</text>

    <line x1="95" y1="10" x2="95" y2="16" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart2)" marker-end="url(#arrEnd2)"/>
    <text x="102" y="15" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">6.00</text>

    <!-- GD&T Perpendicularity Control Frame -->
    <g transform="translate(-40, 50)">
      <rect width="80" height="18" fill="rgba(15, 23, 42, 0.95)" stroke="#38bdf8" stroke-width="1"/>
      <line x1="24" y1="0" x2="24" y2="18" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="56" y1="0" x2="56" y2="18" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="12" y="13" fill="#f59e0b" font-family="monospace" font-size="12" text-anchor="middle">⟂</text>
      <text x="40" y="12.5" fill="#f8fafc" font-family="monospace" font-size="9" text-anchor="middle">0.02</text>
      <text x="68" y="12.5" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">A</text>
    </g>
  </g>
</svg>
