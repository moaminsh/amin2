<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="0.8"/>
    </pattern>
    <marker id="arr2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#080e18"/>
  <rect width="600" height="420" fill="url(#grid2)"/>
  
  <rect x="12" y="12" width="576" height="396" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <rect x="16" y="16" width="568" height="388" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="0.8"/>

  <!-- Title Block -->
  <g transform="translate(370, 340)">
    <rect width="210" height="60" fill="rgba(15, 23, 42, 0.9)" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="20" x2="210" y2="20" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="0" y1="40" x2="210" y2="40" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="105" y1="0" x2="105" y2="60" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="8" y="14" fill="#94a3b8" font-family="monospace" font-size="9">EX-02 // 2D SKETCH</text>
    <text x="112" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">SCALE 1:1</text>
    <text x="8" y="34" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">4-HOLE FLANGE</text>
    <text x="112" y="34" fill="#38bdf8" font-family="monospace" font-size="9">UNITS: MM</text>
    <text x="8" y="54" fill="#38bdf8" font-family="monospace" font-size="9">30° ANGULAR LOBES</text>
    <text x="112" y="54" fill="#10b981" font-family="monospace" font-size="9">FULLY DEFINED</text>
  </g>

  <g transform="translate(250, 195)">
    <!-- Center Axes -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#f43f5e" stroke-width="0.9" stroke-dasharray="10,4,2,4"/>
    <line x1="0" y1="-165" x2="0" y2="165" stroke="#f43f5e" stroke-width="0.9" stroke-dasharray="10,4,2,4"/>

    <!-- 30° Angular Centerline -->
    <line x1="-140" y1="80.8" x2="140" y2="-80.8" stroke="#f59e0b" stroke-width="0.9" stroke-dasharray="8,4,2,4"/>
    <line x1="-140" y1="-80.8" x2="140" y2="80.8" stroke="#f59e0b" stroke-width="0.9" stroke-dasharray="8,4,2,4"/>

    <!-- 30 deg Angular Dimension Arc -->
    <path d="M 60 0 A 60 60 0 0 0 51.96 -30" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="66" y="-14" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">30°</text>

    <!-- Concentric Center Circles: Ø55 and Ø90 (radius 27.5 and 45) -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="0" cy="0" r="27.5" fill="rgba(14, 165, 233, 0.08)" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Center Keyway Slot (width 8, depth 60/2) -->
    <rect x="-4" y="-35" width="8" height="15" fill="#080e18" stroke="#00f2fe" stroke-width="1.6"/>

    <!-- 4 Mounting Lobes / Ears (Outer R18, Inner Hole Ø20 -> r=10) -->
    <!-- Lobe 1 (+30 deg from horizontal: cos30=0.866, sin30=0.5, r=105 -> (91, -52.5)) -->
    <g transform="translate(91, -52.5)">
      <circle cx="0" cy="0" r="18" fill="rgba(8, 14, 24, 0.9)" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    </g>
    <!-- Lobe 2 (-30 deg -> (91, 52.5)) -->
    <g transform="translate(91, 52.5)">
      <circle cx="0" cy="0" r="18" fill="rgba(8, 14, 24, 0.9)" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    </g>
    <!-- Lobe 3 (-91, 52.5) -->
    <g transform="translate(-91, 52.5)">
      <circle cx="0" cy="0" r="18" fill="rgba(8, 14, 24, 0.9)" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    </g>
    <!-- Lobe 4 (-91, -52.5) -->
    <g transform="translate(-91, -52.5)">
      <circle cx="0" cy="0" r="18" fill="rgba(8, 14, 24, 0.9)" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    </g>

    <!-- Outer Profile Connecting Contours -->
    <path d="M 91 -70.5 
             C 70 -85 20 -50 0 -50 
             C -20 -50 -70 -85 -91 -70.5 
             A 18 18 0 0 0 -105 -40
             C -115 -10 -115 10 -105 40
             A 18 18 0 0 0 -91 70.5
             C -70 85 -20 50 0 50
             C 20 50 70 85 91 70.5
             A 18 18 0 0 0 105 40
             C 115 10 115 -10 105 -40
             A 18 18 0 0 0 91 -70.5" 
          fill="none" stroke="#38bdf8" stroke-width="2.2"/>

    <!-- Key Dimensions -->
    <!-- Ø90 Bore -->
    <line x1="31.8" y1="-31.8" x2="60" y2="-80" stroke="#38bdf8" stroke-width="1"/>
    <line x1="60" y1="-80" x2="120" y2="-80" stroke="#38bdf8" stroke-width="1"/>
    <text x="64" y="-85" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">Ø90 EXTERNAL</text>

    <!-- Ø55 Inner Bore -->
    <line x1="-19.4" y1="-19.4" x2="-60" y2="-55" stroke="#38bdf8" stroke-width="1"/>
    <line x1="-60" y1="-55" x2="-120" y2="-55" stroke="#38bdf8" stroke-width="1"/>
    <text x="-118" y="-60" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">Ø55 BORE</text>

    <!-- 4x Ø20 Holes & R18 -->
    <line x1="91" y1="-52.5" x2="130" y2="-110" stroke="#38bdf8" stroke-width="1"/>
    <line x1="130" y1="-110" x2="195" y2="-110" stroke="#38bdf8" stroke-width="1"/>
    <text x="132" y="-115" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">4X Ø20 THRU</text>
    <text x="132" y="-100" fill="#94a3b8" font-family="monospace" font-size="10">4X R18 EXTERNAL</text>

    <!-- Keyway Slot dimension 8mm and 60mm -->
    <line x1="-4" y1="-38" x2="4" y2="-38" stroke="#f59e0b" stroke-width="1"/>
    <text x="-12" y="-42" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">W: 8</text>

    <!-- Center distance 60 dimension -->
    <line x1="-91" y1="52.5" x2="91" y2="52.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="0" y1="55" x2="0" y2="90" stroke="#38bdf8" stroke-width="1"/>
    <text x="-25" y="105" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">DIST: 60 MM</text>
  </g>
</svg>
