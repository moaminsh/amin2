<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <pattern id="grid7" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="0.8"/>
    </pattern>
    <!-- Hatching for Section Cut -->
    <pattern id="hatch7" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.2"/>
    </pattern>
    <filter id="glow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#080e18"/>
  <rect width="600" height="420" fill="url(#grid7)"/>
  
  <rect x="12" y="12" width="576" height="396" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <rect x="16" y="16" width="568" height="388" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="0.8"/>

  <!-- Title Block -->
  <g transform="translate(370, 340)">
    <rect width="210" height="60" fill="rgba(15, 23, 42, 0.9)" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="20" x2="210" y2="20" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="0" y1="40" x2="210" y2="40" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="105" y1="0" x2="105" y2="60" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="8" y="14" fill="#94a3b8" font-family="monospace" font-size="9">EX-07 // 3D PART</text>
    <text x="112" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">SCALE 1:1</text>
    <text x="8" y="34" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">ANGLED BRACKET</text>
    <text x="112" y="34" fill="#38bdf8" font-family="monospace" font-size="9">UNITS: MM</text>
    <text x="8" y="54" fill="#38bdf8" font-family="monospace" font-size="9">RIB GUSSETS R3</text>
    <text x="112" y="54" fill="#10b981" font-family="monospace" font-size="9">THK: 4MM</text>
  </g>

  <!-- Left: Section View with Ribs and Hatching -->
  <g transform="translate(40, 45)">
    <text x="0" y="14" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// SECTION G-G &amp; ANGLES</text>

    <!-- Base Plate 81mm long, 4mm thick -->
    <rect x="30" y="190" width="190" height="15" fill="url(#hatch7)" stroke="#00f2fe" stroke-width="2" filter="url(#glow7)"/>
    <!-- Slotted Hole in Base -->
    <rect x="70" y="192" width="40" height="11" rx="5" fill="#080e18" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Slanted Wall at 52° Angle (length 110px) -->
    <!-- Cos(52) = 0.615, Sin(52) = 0.788 -->
    <path d="M 180 190 L 115 80 L 105 85 L 170 190 Z" fill="url(#hatch7)" stroke="#00f2fe" stroke-width="2"/>

    <!-- Triangular Stiffening Rib (Gusset with R3) -->
    <path d="M 140 190 L 170 190 L 135 110 Z" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.8"/>
    <text x="145" y="160" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">RIB 4</text>

    <!-- Angle 52° Dimension Arc -->
    <path d="M 195 190 A 25 25 0 0 1 180 170" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="200" y="178" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">52°</text>

    <!-- Base 81 Dimension -->
    <line x1="30" y1="220" x2="220" y2="220" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="30,220 38,217 38,223" fill="#38bdf8"/>
    <polygon points="220,220 212,217 212,223" fill="#38bdf8"/>
    <text x="110" y="235" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">L: 81</text>

    <!-- Height 26 Dimension -->
    <line x1="15" y1="80" x2="15" y2="190" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="15,80 12,88 18,88" fill="#38bdf8"/>
    <polygon points="15,190 12,182 18,182" fill="#38bdf8"/>
    <text x="0" y="140" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">26</text>

    <!-- Slanted Wall Holes Ø10 -->
    <circle cx="125" cy="100" r="5" fill="#080e18" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="95" fill="#38bdf8" font-family="monospace" font-size="9">Ø10</text>
  </g>

  <!-- Right: 3D Isometric View -->
  <g transform="translate(330, 45)">
    <text x="0" y="14" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">// 3D ISOMETRIC CAST BRACKET</text>

    <!-- Isometric Cast Bracket with Dual Ribs -->
    <!-- Base Plate in Iso -->
    <polygon points="30,175 140,120 180,140 70,195" fill="rgba(14, 165, 233, 0.2)" stroke="#00f2fe" stroke-width="1.8"/>
    <polygon points="30,175 70,195 70,205 30,185" fill="rgba(2, 132, 199, 0.3)" stroke="#00f2fe" stroke-width="1.8"/>
    <polygon points="70,195 180,140 180,150 70,205" fill="rgba(2, 132, 199, 0.3)" stroke="#00f2fe" stroke-width="1.8"/>

    <!-- Slanted Upright Wall in Iso -->
    <polygon points="100,140 140,120 100,60 60,80" fill="rgba(56, 189, 248, 0.35)" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Two Rib Gussets -->
    <polygon points="85,150 75,100 80,100 90,150" fill="rgba(16, 185, 129, 0.35)" stroke="#10b981" stroke-width="1.6"/>
    <polygon points="120,132 110,82 115,82 125,132" fill="rgba(16, 185, 129, 0.35)" stroke="#10b981" stroke-width="1.6"/>

    <!-- Technical Annotations -->
    <text x="20" y="240" fill="#10b981" font-family="monospace" font-size="10">2X REINFORCED RIBS R3 // THK 4MM</text>
    <text x="20" y="256" fill="#94a3b8" font-family="monospace" font-size="10">ANGLES: 114° &amp; 24° // SECTION F-F</text>
  </g>
</svg>
