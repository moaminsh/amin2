<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="0.8"/>
    </pattern>
    <marker id="arr3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#080e18"/>
  <rect width="600" height="420" fill="url(#grid3)"/>
  
  <rect x="12" y="12" width="576" height="396" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
  <rect x="16" y="16" width="568" height="388" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="0.8"/>

  <!-- Title Block -->
  <g transform="translate(370, 340)">
    <rect width="210" height="60" fill="rgba(15, 23, 42, 0.9)" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="20" x2="210" y2="20" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="0" y1="40" x2="210" y2="40" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <line x1="105" y1="0" x2="105" y2="60" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="8" y="14" fill="#94a3b8" font-family="monospace" font-size="9">EX-03 // 2D SKETCH</text>
    <text x="112" y="14" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">SCALE 1:2</text>
    <text x="8" y="34" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">CONNECTING ROD</text>
    <text x="112" y="34" fill="#38bdf8" font-family="monospace" font-size="9">UNITS: MM</text>
    <text x="8" y="54" fill="#38bdf8" font-family="monospace" font-size="9">AUTOMOTIVE ENGINE</text>
    <text x="112" y="54" fill="#10b981" font-family="monospace" font-size="9">FULLY DEFINED</text>
  </g>

  <g transform="translate(60, 190)">
    <!-- Longitudinal Centerline (250mm between centers) -->
    <!-- Scale: 1mm = 1.3px -> 250mm = 325px -->
    <!-- Big End at X=70, Small End at X=395 -->
    <line x1="0" y1="0" x2="440" y2="0" stroke="#f43f5e" stroke-width="0.9" stroke-dasharray="10,4,2,4"/>
    <line x1="70" y1="-100" x2="70" y2="100" stroke="#f43f5e" stroke-width="0.9" stroke-dasharray="10,4,2,4"/>
    <line x1="395" y1="-80" x2="395" y2="80" stroke="#f43f5e" stroke-width="0.9" stroke-dasharray="10,4,2,4"/>

    <!-- BIG END (Left side at X=70) -->
    <!-- Crank Pin Bore Ø52 (r=34px), Outer Body Ø63 (r=45px) -->
    <circle cx="70" cy="0" r="45" fill="rgba(8, 14, 24, 0.9)" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow3)"/>
    <circle cx="70" cy="0" r="34" fill="#080e18" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- 4 Bearing Cap Bolt Holes Ø10 (in cap ear flanges at pitch spacings 17, 26, 40) -->
    <rect x="25" y="-62" width="90" height="124" rx="8" fill="none" stroke="#00f2fe" stroke-width="1.8"/>
    <!-- Cap bolt holes -->
    <circle cx="45" cy="-45" r="6" fill="#080e18" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="95" cy="-45" r="6" fill="#080e18" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="6" fill="#080e18" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="95" cy="45" r="6" fill="#080e18" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- SMALL END (Right side at X=395) -->
    <!-- Pin Bore Ø24 (r=16px), Outer Body R35 (r=26px) -->
    <circle cx="395" cy="0" r="26" fill="rgba(8, 14, 24, 0.9)" stroke="#00f2fe" stroke-width="2.2"/>
    <circle cx="395" cy="0" r="16" fill="#080e18" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- CONNECTING SHANK (H-Beam / Tapered Rod with R72 and R6 Fillets) -->
    <!-- Top profile line with smooth fillets -->
    <path d="M 115 -20 
             Q 150 -16 230 -14 
             L 345 -12 
             Q 370 -12 373 -18" 
          fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <path d="M 115 20 
             Q 150 16 230 14 
             L 345 12 
             Q 370 12 373 18" 
          fill="none" stroke="#38bdf8" stroke-width="2.2"/>

    <!-- Inner Web Flange Profile (Recessed H-Beam Pocket) -->
    <path d="M 130 -10 L 350 -7 Q 355 0 350 7 L 130 10 Q 125 0 130 -10 Z" 
          fill="rgba(14, 165, 233, 0.08)" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="3,2"/>

    <!-- Dimension: Center Distance 250 mm -->
    <line x1="70" y1="-85" x2="395" y2="-85" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="70" y1="-75" x2="70" y2="-95" stroke="#38bdf8" stroke-width="1"/>
    <line x1="395" y1="-75" x2="395" y2="-95" stroke="#38bdf8" stroke-width="1"/>
    <!-- Arrowheads -->
    <polygon points="70,-85 80,-88 80,-82" fill="#38bdf8"/>
    <polygon points="395,-85 385,-88 385,-82" fill="#38bdf8"/>
    <text x="210" y="-92" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CENTER DIST: 250 MM</text>

    <!-- Big End Callouts -->
    <line x1="70" y1="34" x2="10" y2="90" stroke="#38bdf8" stroke-width="1"/>
    <line x1="10" y1="90" x2="-35" y2="90" stroke="#38bdf8" stroke-width="1"/>
    <text x="-30" y="85" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">BORE: Ø52</text>
    <text x="-30" y="102" fill="#94a3b8" font-family="monospace" font-size="9">BODY: Ø63</text>

    <!-- 4x M10 Bolt Holes -->
    <line x1="95" y1="45" x2="140" y2="95" stroke="#38bdf8" stroke-width="1"/>
    <line x1="140" y1="95" x2="220" y2="95" stroke="#38bdf8" stroke-width="1"/>
    <text x="145" y="90" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">4X Ø10 BOLTS</text>
    <text x="145" y="105" fill="#94a3b8" font-family="monospace" font-size="9">SPACING: 17, 26, 40</text>

    <!-- Small End Callouts -->
    <line x1="395" y1="-16" x2="430" y2="-50" stroke="#38bdf8" stroke-width="1"/>
    <line x1="430" y1="-50" x2="500" y2="-50" stroke="#38bdf8" stroke-width="1"/>
    <text x="435" y="-55" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">BORE: Ø24</text>
    <text x="435" y="-40" fill="#94a3b8" font-family="monospace" font-size="9">PROFILE: R35</text>

    <!-- Transition Fillet Callout R72 & R6 -->
    <text x="210" y="40" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">FILLETS: R72 &amp; R6 TANGENT</text>
  </g>
</svg>
