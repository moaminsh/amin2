<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="100%" height="100%">
  <defs>
    <pattern id="cadGrid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="0.75"/>
    </pattern>
    <pattern id="cadGridMajor3" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1"/>
    </pattern>
    <pattern id="hatch3" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>
    </pattern>
    <marker id="arrEnd3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrStart3" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 2 L 0 5 L 10 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrSec3" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 12 6 L 0 11 Z" fill="#f43f5e"/>
    </marker>
    <filter id="glow3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sheet Background -->
  <rect width="840" height="580" fill="#060b13" class="cad-bg"/>
  <rect width="840" height="580" fill="url(#cadGrid3)" class="cad-grid"/>
  <rect width="840" height="580" fill="url(#cadGridMajor3)" class="cad-grid-major"/>

  <!-- ISO Border & Zone Grid -->
  <rect x="18" y="16" width="804" height="548" fill="none" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="23" y="21" width="794" height="538" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="0.8"/>

  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">
    <text x="73" y="14">1</text><text x="73" y="570">1</text>
    <text x="173" y="14">2</text><text x="173" y="570">2</text>
    <text x="273" y="14">3</text><text x="273" y="570">3</text>
    <text x="373" y="14">4</text><text x="373" y="570">4</text>
    <text x="473" y="14">5</text><text x="473" y="570">5</text>
    <text x="573" y="14">6</text><text x="573" y="570">6</text>
    <text x="673" y="14">7</text><text x="673" y="570">7</text>
    <text x="773" y="14">8</text><text x="773" y="570">8</text>
  </g>
  <g fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle" dominant-baseline="central">
    <text x="10" y="85">A</text><text x="830" y="85">A</text>
    <text x="10" y="220">B</text><text x="830" y="220">B</text>
    <text x="10" y="355">C</text><text x="830" y="355">C</text>
    <text x="10" y="490">D</text><text x="830" y="490">D</text>
  </g>

  <!-- Title Block (ISO 7200) -->
  <g transform="translate(480, 440)">
    <rect width="337" height="119" fill="rgba(10, 18, 30, 0.95)" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="337" y2="28" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="56" x2="337" y2="56" stroke="#0284c7" stroke-width="1"/>
    <line x1="0" y1="84" x2="337" y2="84" stroke="#0284c7" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="84" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="245" y1="28" x2="245" y2="84" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="75" y1="84" x2="75" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="160" y1="84" x2="160" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>
    <line x1="245" y1="84" x2="245" y2="119" stroke="rgba(56, 189, 248, 0.35)" stroke-width="0.8"/>

    <text x="8" y="13" fill="#64748b" font-family="monospace" font-size="8">ORGANIZATION / LAB</text>
    <text x="8" y="23" fill="#00f2fe" font-family="monospace" font-size="10.5" font-weight="bold">M. SHARIF CAD ACADEMY</text>
    <text x="168" y="13" fill="#64748b" font-family="monospace" font-size="8">DRAWING NUMBER</text>
    <text x="168" y="24" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">MAS-SW-EX03-REV.C</text>

    <text x="8" y="41" fill="#64748b" font-family="monospace" font-size="8">TITLE / PART DESCRIPTION</text>
    <text x="8" y="52" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">ENGINE CONNECTING ROD</text>
    <text x="168" y="41" fill="#64748b" font-family="monospace" font-size="8">PROJECTION</text>
    <g transform="translate(185, 48)">
      <polygon points="0,4 0,-4 14,-7 14,7" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
      <line x1="-4" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="3,1.5"/>
      <circle cx="24" cy="0" r="4" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
      <circle cx="24" cy="0" r="7" fill="none" stroke="#f59e0b" stroke-width="0.9"/>
    </g>
    <text x="252" y="41" fill="#64748b" font-family="monospace" font-size="8">MATERIAL</text>
    <text x="252" y="52" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="bold">AISI 4340 FORGED</text>

    <text x="8" y="69" fill="#64748b" font-family="monospace" font-size="8">GENERAL TOLERANCE</text>
    <text x="8" y="80" fill="#94a3b8" font-family="monospace" font-size="9">ISO 2768-f (±0.05 mm)</text>
    <text x="168" y="69" fill="#64748b" font-family="monospace" font-size="8">SURFACE FINISH</text>
    <text x="168" y="80" fill="#f8fafc" font-family="monospace" font-size="9">Ra 0.8 µm ▽▽▽</text>
    <text x="252" y="69" fill="#64748b" font-family="monospace" font-size="8">WEIGHT (CALC)</text>
    <text x="252" y="80" fill="#94a3b8" font-family="monospace" font-size="9">0.518 kg</text>

    <text x="8" y="97" fill="#64748b" font-family="monospace" font-size="7.5">DESIGNED BY</text>
    <text x="8" y="112" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">M. SHARIF</text>
    <text x="82" y="97" fill="#64748b" font-family="monospace" font-size="7.5">APPROVED</text>
    <text x="82" y="112" fill="#38bdf8" font-family="monospace" font-size="9">ENG. QA</text>
    <text x="168" y="97" fill="#64748b" font-family="monospace" font-size="7.5">SCALE</text>
    <text x="168" y="112" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold">1:1 (A3)</text>
    <text x="252" y="97" fill="#64748b" font-family="monospace" font-size="7.5">STATUS</text>
    <text x="252" y="112" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">RELEASED</text>
  </g>

  <!-- Technical Notes -->
  <g transform="translate(35, 472)">
    <rect width="270" height="85" fill="rgba(10, 18, 30, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9.5" font-weight="bold">TECHNICAL NOTES // مـلاحظـات فـنـی:</text>
    <text x="10" y="32" fill="#94a3b8" font-family="monospace" font-size="8.5">1. BORE CENTERS DISTANCE: 150.00 ±0.03 MM.</text>
    <text x="10" y="46" fill="#94a3b8" font-family="monospace" font-size="8.5">2. BIG END BORE Ø52 H7, PIN BORE Ø24 H6.</text>
    <text x="10" y="60" fill="#94a3b8" font-family="monospace" font-size="8.5">3. SHANK H-BEAM PROFILE SECTION C-C.</text>
    <text x="10" y="74" fill="#10b981" font-family="monospace" font-size="8.5">4. HEAT TREATMENT: QUENCH &amp; TEMPER TO 32-36 HRC.</text>
  </g>

  <!-- 3D Isometric Preview Inset -->
  <g transform="translate(635, 45)">
    <rect width="180" height="150" fill="rgba(8, 14, 24, 0.9)" stroke="#0284c7" stroke-width="1.2"/>
    <text x="10" y="16" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">ISOMETRIC VIEW (3D)</text>
    <text x="10" y="27" fill="#64748b" font-family="monospace" font-size="7.5">SOLIDWORKS SOLID BODY</text>

    <!-- 3D Iso Render of Connecting Rod -->
    <g transform="translate(90, 85) rotate(-35) scale(0.48)">
      <!-- Big End Eye 3D -->
      <ellipse cx="-75" cy="0" rx="35" ry="24" fill="#1e3a5f" stroke="#00f2fe" stroke-width="2"/>
      <ellipse cx="-75" cy="0" rx="20" ry="14" fill="#060b13" stroke="#38bdf8" stroke-width="1.8"/>

      <!-- H-Beam Shank 3D -->
      <path d="M -45 -14 L 45 -8 L 45 8 L -45 14 Z" fill="#0f2b48" stroke="#00f2fe" stroke-width="2"/>
      <!-- Recess Pocket -->
      <path d="M -38 -8 L 38 -4 L 38 4 L -38 8 Z" fill="#060b13" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Small End Eye 3D -->
      <ellipse cx="75" cy="0" rx="24" ry="16" fill="#1e3a5f" stroke="#00f2fe" stroke-width="2"/>
      <ellipse cx="75" cy="0" rx="12" ry="8" fill="#060b13" stroke="#38bdf8" stroke-width="1.8"/>
    </g>
    <text x="10" y="142" fill="#f59e0b" font-family="monospace" font-size="8">FORGED HIGH STRENGTH STEEL</text>
  </g>

  <!-- ==================== MAIN VIEW: CONNECTING ROD ELEVATION ==================== -->
  <g transform="translate(260, 230)">
    <text x="-210" y="-185" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold">FRONT VIEW // شاتون موتور با تیر H-Beam</text>
    <text x="-210" y="-172" fill="#64748b" font-family="monospace" font-size="9">PLANE: FRONT PLANE // FULLY DEFINED 2D SKETCH</text>

    <!-- Longitudinal Centerline Axis -->
    <line x1="-155" y1="0" x2="165" y2="0" stroke="#f43f5e" stroke-width="0.9" stroke-dasharray="12,4,2,4"/>

    <!-- Big End (Left, Center at -75, 0) -->
    <line x1="-75" y1="-85" x2="-75" y2="85" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>
    <circle cx="-75" cy="0" r="42" fill="rgba(14, 165, 233, 0.08)" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow3)"/>
    <circle cx="-75" cy="0" r="26" fill="#060b13" stroke="#38bdf8" stroke-width="2.2"/>
    <!-- Bolt Boss Lugs (Top & Bottom) -->
    <rect x="-85" y="-50" width="20" height="15" rx="3" fill="none" stroke="#00f2fe" stroke-width="1.8"/>
    <rect x="-85" y="35" width="20" height="15" rx="3" fill="none" stroke="#00f2fe" stroke-width="1.8"/>
    <circle cx="-75" cy="-42" r="5" fill="#060b13" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="-75" cy="42" r="5" fill="#060b13" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Small End (Right, Center at +75, 0) -->
    <line x1="75" y1="-55" x2="75" y2="55" stroke="#f43f5e" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>
    <circle cx="75" cy="0" r="22" fill="rgba(14, 165, 233, 0.08)" stroke="#00f2fe" stroke-width="2.2" filter="url(#glow3)"/>
    <circle cx="75" cy="0" r="12" fill="#060b13" stroke="#38bdf8" stroke-width="2.2"/>

    <!-- H-Beam Shank Outer Flanges (Tapered Profile) -->
    <path d="M -42 -22 C -20 -16 20 -14 56 -10" fill="none" stroke="#00f2fe" stroke-width="2.2"/>
    <path d="M -42 22 C -20 16 20 14 56 10" fill="none" stroke="#00f2fe" stroke-width="2.2"/>

    <!-- H-Beam Internal Recess / Lightening Pocket -->
    <path d="M -32 -9 L 48 -5 L 48 5 L -32 9 Z" fill="rgba(14, 165, 233, 0.15)" stroke="#38bdf8" stroke-width="1.6"/>

    <!-- Transition Fillets -->
    <path d="M -46 -30 C -40 -26 -38 -22 -35 -14" fill="none" stroke="#00f2fe" stroke-width="2"/>
    <path d="M -46 30 C -40 26 -38 22 -35 14" fill="none" stroke="#00f2fe" stroke-width="2"/>

    <!-- Section Cut Indicator C-C through Shank -->
    <line x1="10" y1="-28" x2="10" y2="28" stroke="#f43f5e" stroke-width="2"/>
    <line x1="10" y1="-28" x2="22" y2="-28" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrSec3)"/>
    <text x="24" y="-30" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">C</text>
    <line x1="10" y1="28" x2="22" y2="28" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrSec3)"/>
    <text x="24" y="38" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="bold">C</text>

    <!-- ==================== DIMENSIONS ==================== -->
    <!-- Center to Center Distance: 150.00 ±0.03 -->
    <line x1="-75" y1="0" x2="-75" y2="95" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="75" y1="0" x2="75" y2="95" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="-75" y1="90" x2="75" y2="90" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrStart3)" marker-end="url(#arrEnd3)"/>
    <text x="0" y="85" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">150.00 ±0.03</text>

    <!-- Big End Bore Ø52 H7 -->
    <line x1="-75" y1="0" x2="-130" y2="-50" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart3)"/>
    <line x1="-130" y1="-50" x2="-185" y2="-50" stroke="#38bdf8" stroke-width="1"/>
    <text x="-182" y="-55" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold">CRANK BORE Ø52 H7</text>
    <text x="-182" y="-45" fill="#94a3b8" font-family="monospace" font-size="8.5">( +0.030 / 0 ) THRU</text>

    <!-- Small End Pin Bore Ø24 H6 -->
    <line x1="75" y1="0" x2="115" y2="-45" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart3)"/>
    <line x1="115" y1="-45" x2="165" y2="-45" stroke="#38bdf8" stroke-width="1"/>
    <text x="118" y="-50" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold">PIN BORE Ø24 H6</text>
    <text x="118" y="-40" fill="#94a3b8" font-family="monospace" font-size="8.5">( +0.013 / 0 ) THRU</text>

    <!-- Bolt Lug Pitch 84.00 -->
    <line x1="-75" y1="-42" x2="-115" y2="-42" stroke="#f59e0b" stroke-width="0.8"/>
    <line x1="-75" y1="42" x2="-115" y2="42" stroke="#f59e0b" stroke-width="0.8"/>
    <line x1="-110" y1="-42" x2="-110" y2="42" stroke="#f59e0b" stroke-width="1" marker-start="url(#arrStart3)" marker-end="url(#arrEnd3)"/>
    <text x="-115" y="4" fill="#f59e0b" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="end">84.00</text>

    <!-- 2X M9 Bolts Callout -->
    <text x="-182" y="30" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">2X M9x1.00 BOLT HOLES</text>
  </g>

  <!-- ==================== SECTION C-C H-BEAM DETAIL VIEW ==================== -->
  <g transform="translate(560, 240)">
    <text x="-40" y="-35" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">SECTION C-C // مقطع تیر H</text>
    <text x="-40" y="-22" fill="#64748b" font-family="monospace" font-size="8">SCALE 2:1 // DETAIL OF WEB &amp; FLANGE</text>

    <!-- H-Beam Cross-Section Profile with Hatch -->
    <polygon points="-24,0 24,0 24,10 6,10 6,40 24,40 24,50 -24,50 -24,40 -6,40 -6,10 -24,10" fill="url(#hatch3)" stroke="#00f2fe" stroke-width="2"/>

    <!-- Dimensions of H-Beam -->
    <!-- Flange Width 48.00 -->
    <line x1="-24" y1="-8" x2="24" y2="-8" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart3)" marker-end="url(#arrEnd3)"/>
    <text x="0" y="-12" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">24.00</text>

    <!-- Web Thickness 12.00 -->
    <line x1="-6" y1="25" x2="6" y2="25" stroke="#f59e0b" stroke-width="1" marker-start="url(#arrStart3)" marker-end="url(#arrEnd3)"/>
    <text x="12" y="28" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="bold">6.00 WEB</text>

    <!-- Total Height 50.00 -->
    <line x1="34" y1="0" x2="34" y2="50" stroke="#38bdf8" stroke-width="1" marker-start="url(#arrStart3)" marker-end="url(#arrEnd3)"/>
    <text x="40" y="28" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold">26.00</text>

    <!-- GD&T Parallelism -->
    <g transform="translate(-40, 70)">
      <rect width="80" height="18" fill="rgba(15, 23, 42, 0.95)" stroke="#38bdf8" stroke-width="1"/>
      <line x1="24" y1="0" x2="24" y2="18" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="56" y1="0" x2="56" y2="18" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="12" y="13" fill="#f59e0b" font-family="monospace" font-size="12" text-anchor="middle">⫽</text>
      <text x="40" y="12.5" fill="#f8fafc" font-family="monospace" font-size="9" text-anchor="middle">0.03</text>
      <text x="68" y="12.5" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">A</text>
    </g>
  </g>
</svg>
